<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Attribution | ReLEAF &middot; iGEM 2026</title>
  <meta name="description" content="Who did what on ReLEAF, and who helped us do it, on iGEM's standard Project Attribution form." />
  <link rel="icon" href="../assets/img/logo.png" />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/nav.css" />
  <link rel="stylesheet" href="../assets/css/page.css" />
  <link rel="stylesheet" href="../assets/css/bannerhead.css?v=20261020b" />
<link rel="stylesheet" href="../assets/css/fulllines.css?v=1014" />
</head>
<body>
<!-- =============================================================================
     ATTRIBUTION. This page is special because iGEM says exactly what may be on
     it, and the list is short. From the 2026 wiki template brief:

         "What Should this Page Contain?
            The standard navigation menu of your wiki
            The standard footer of your wiki
            The embedded iframe containing your standardized team's Project
            Attribution form
            Nothing else"

     So: nav, iframe, footer, plus the bare page title. No prose, no
     photographs, no cards, no thank-you wall, no hero image. The form itself
     is filled in on teams.igem.org, not here; this page only embeds it (team
     6072 is GEMS-Taiwan). The students' draft of who did what
     (Team/Attribution/Attributions Content.docx) is the input for that form,
     not text for this page. Anything else the team wants to say about who
     helped goes on Human Practices or in the notebooks.

     The iframe cannot size itself across origins, so teams.igem.org posts its
     height to us and the small script at the foot resizes the frame. That
     script is the only JavaScript this page needs.
     ========================================================================== -->

  <div id="site-nav" data-base="../" data-tab="team" data-page="attributions"></div>
  <div class="sitenav-spacer"></div>

  <header class="bannerhead bannerhead--rest" data-tab="team" style="--abs-h: 6rem">
    <h1 class="visually-hidden">Attribution</h1>
    <div class="bannerhead__art">
      <img src="../assets/img/headers/attributions.webp"
           srcset="../assets/img/headers/attributions-w1200.webp 1200w, ../assets/img/headers/attributions.webp 2400w"
           sizes="(max-width: 1280px) 100vw, 1280px"
           alt="Attributions. The team&#x27;s workroom: students and advisors at wooden desks with laptops, looking up at a large screen."
           width="2400" height="839" fetchpriority="high" />
    </div>
  </header>

  <div class="pagewrap" style="grid-template-columns:minmax(0,1fr)">
    <main class="pagebody" style="max-width:none">
      <iframe id="igem-attribution-form"
              title="ReLEAF Project Attribution form"
              src="https://teams.igem.org/wiki/6072/attributions"
              style="width:100%; height:800px; border:0"></iframe>

    </main>
  </div>


  <footer class="footer2">
    <div class="footer2__inner footer2__inner--legal">
      <div class="footer2__legal">
        <p><b>ReLEAF</b> &middot; GEMS Taiwan &middot; iGEM 2026 &middot; Biomanufacturing Village</p>
        <p>&copy; 2026 &middot; Content on this wiki is licensed under a <a href="https://creativecommons.org/licenses/by/4.0/" rel="license">Creative Commons Attribution 4.0 International license</a>.</p>
        <p>The repository used to create this website is available at <a href="https://gitlab.igem.org/2026/gems-taiwan">gitlab.igem.org/2026/gems-taiwan</a>.</p>
      </div>
    </div>
  </footer>

  <script src="../assets/data/site-nav.js" fetchpriority="high"></script>
  <script src="../assets/js/nav.js" fetchpriority="high"></script>
  <script>
    /* teams.igem.org tells us how tall the form is; nothing else is accepted. */
    window.addEventListener("message", function (e) {
      if (e.origin !== "https://teams.igem.org") return;
      var payload;
      try { payload = JSON.parse(e.data); } catch (err) { return; }
      if (!payload || payload.type !== "igem-attribution-form") return;
      var frame = document.getElementById("igem-attribution-form");
      if (frame) frame.style.height = (payload.data + 100) + "px";
    });
  </script>
</body>
</html>
