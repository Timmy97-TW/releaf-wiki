<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ReLeaf BR-01 Twin</title>
<!--
  ReLeaf BR-01 · operator interface and digital twin · build 2026-09-24
  Scope = the 21 October 2026 deliverable:
    measured  OD600 (lumen, inline), pH (lumen), loop flow (FT-01),
              PT-01 lumen in, PT-03 lumen out, PT-04 shell in, PT-05 shell out
    actuated  lumen pinch valve (XV-01), green light (L-01)
    manual    loop flow (pump set by hand)
    online    weather forecast (Open-Meteo), falls back to a stored snapshot
  Design basis
    ISA-101 HMI: grey field, colour only for state; every number carries its
      unit, its limits and where it came from.
    Digital-twin structure: Tao 5-dimension model / ISO 23247 (physical,
      virtual, data, connection, services), as used by Satwekar et al. 2026.
    Twin vs shadow: automated two-way data flow (Gargalo et al. 2021;
      Portela et al. 2021). The model is "the heart" (Portela), so the growth
      model is live, re-fitted on every new point (Cabaneros Lopez et al. 2020)
      and scored against its own forecasts (NRMSE < 15 %, Sinner et al. 2021).
  One file, no external fonts or libraries. The only network call is the
  weather request, and the page works without it.
  Growth prior: 04_Results/lpa_growth_fit_20260919.json, embedded below by
  03_Scripts/embed_fit_into_ui.py. Re-run both scripts after a new LPA run.
-->
<style>
/* Hallmark · redesign · app scope (operator HMI, not a page) · tone: utilitarian-technical
 * theme: custom (vibe: "instrument panel, night-navy ink, leaf-lime signal")
 *   paper oklch(95.5% 0.006 250) · ink oklch(24% 0.065 262) navy from the team logo
 *   signal oklch(76% 0.17 128) lime from the team logo, used ONLY for the green light
 *   display: DIN Alternate / Bahnschrift (instrument numerals) · body: Avenir Next / Segoe UI
 * rules: ISA-101, colour only for state; hairlines, not shadows; no nested boxes
 * pre-emit critique: P4 H4 E4 S5 R5 V4
 */
:root{
  --color-paper:    oklch(95.5% 0.006 250);
  --color-panel:    oklch(99% 0.003 250);
  --color-panel-2:  oklch(92.5% 0.008 250);
  --color-rule:     oklch(84% 0.012 255);
  --color-rule-2:   oklch(90% 0.009 255);
  --color-ink:      oklch(24% 0.065 262);
  --color-ink-2:    oklch(44% 0.035 258);
  --color-ink-3:    oklch(60% 0.02 255);
  --color-ink-inv:  oklch(98% 0.005 250);
  --color-signal:   oklch(76% 0.17 128);
  --color-signal-ink: oklch(42% 0.11 130);
  --color-signal-bg: oklch(95% 0.05 125);
  --color-data:     oklch(46% 0.11 250);
  --color-data-2:   oklch(64% 0.08 245);
  --color-model:    oklch(47% 0.12 300);
  --color-model-bg: oklch(95% 0.02 300);
  --color-warn:     oklch(58% 0.13 70);
  --color-warn-bg:  oklch(95% 0.05 85);
  --color-alarm:    oklch(52% 0.19 27);
  --color-alarm-bg: oklch(94% 0.04 25);
  --color-heat:     oklch(62% 0.16 45);
  --color-pipe:     oklch(72% 0.015 250);
  --color-focus:    oklch(55% 0.15 250);
  --font-display: "DIN Alternate","DIN Condensed","Bahnschrift","Roboto Condensed","Arial Narrow",sans-serif;
  --font-body: "Avenir Next","Segoe UI","Noto Sans TC","PingFang TC",system-ui,sans-serif;
  --font-num: "DIN Alternate","Bahnschrift","Roboto Mono",ui-monospace,monospace;
  --font-mono: ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --space-3xs:2px; --space-2xs:4px; --space-xs:8px; --space-sm:12px; --space-md:16px; --space-lg:24px; --space-xl:32px;
  --text-xs:11px; --text-sm:12.5px; --text-md:14px; --text-lg:17px; --text-xl:22px; --text-2xl:30px;
  --radius:4px; --radius-pill:999px;
  --ease-out:cubic-bezier(0.16,1,0.3,1); --dur-short:160ms;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;overflow-x:clip}
body{background:var(--color-paper);color:var(--color-ink);font:var(--text-md)/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--color-focus);outline-offset:2px}
.mono{font-family:var(--font-mono)}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-style:normal}
h2{font:700 var(--text-md)/1.3 var(--font-display);letter-spacing:.02em}
p{margin:0}
a{color:var(--color-data)}
code{font-family:var(--font-mono);font-size:var(--text-xs);background:var(--color-panel-2);padding:1px 5px;border-radius:var(--radius)}

/* ---------- frame ---------- */
.app{display:grid;grid-template-rows:auto auto 1fr;min-height:100vh}
.top{display:flex;align-items:center;gap:var(--space-md);padding:var(--space-xs) var(--space-md);background:var(--color-ink);color:var(--color-ink-inv);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:var(--space-sm);min-width:0}
.brand img{width:42px;height:42px;border-radius:50%;flex:none;display:block}
.brand b{display:block;font:700 var(--text-lg)/1.1 var(--font-display);letter-spacing:.03em;white-space:nowrap}
.brand small{display:block;font-size:var(--text-xs);opacity:.7;white-space:nowrap}
.tfield{display:flex;flex-direction:column;padding:0 var(--space-sm);border-left:1px solid oklch(40% 0.05 262)}
.tfield .k{font-size:10px;opacity:.65;letter-spacing:.08em;text-transform:uppercase}
.tfield .v{font:600 var(--text-lg)/1.1 var(--font-num);font-variant-numeric:tabular-nums}
.status{flex:1 1 260px;display:flex;align-items:center;gap:var(--space-xs);padding:var(--space-2xs) var(--space-sm);border-radius:var(--radius);background:oklch(32% 0.06 262);min-width:0}
.status .dot{width:9px;height:9px;border-radius:50%;background:var(--color-signal);flex:none}
.status b{font-size:var(--text-sm)}
.status span{font-size:var(--text-sm);opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status.warn{background:var(--color-warn-bg);color:var(--color-ink)} .status.warn .dot{background:var(--color-warn)}
.status.alarm{background:var(--color-alarm);color:var(--color-ink-inv)} .status.alarm .dot{background:var(--color-ink-inv);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.tactions{display:flex;gap:var(--space-xs);align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 var(--space-sm);border-radius:var(--radius);border:1px solid oklch(45% 0.05 262);font-size:var(--text-sm);white-space:nowrap;color:var(--color-ink-inv)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--color-ink-3)}
.chip.live i{background:var(--color-signal)} .chip.demo i{background:var(--color-warn)}
.top .seg{border-color:oklch(45% 0.05 262);background:transparent}
.top .seg button{color:var(--color-ink-inv);border-color:oklch(45% 0.05 262)}
.top .seg button.on{background:var(--color-ink-inv);color:var(--color-ink)}
.seg{display:inline-flex;border:1px solid var(--color-rule);border-radius:var(--radius);overflow:hidden;background:var(--color-panel)}
.seg button{padding:4px 10px;font-size:var(--text-sm);border-left:1px solid var(--color-rule);white-space:nowrap}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--color-ink);color:var(--color-ink-inv)}
.btn-stop{height:30px;padding:0 var(--space-sm);border-radius:var(--radius);background:var(--color-alarm);color:var(--color-ink-inv);font:700 var(--text-sm) var(--font-display);letter-spacing:.06em;white-space:nowrap}

.nav{display:flex;gap:0;padding:0 var(--space-md);background:var(--color-panel);border-bottom:1px solid var(--color-rule);overflow-x:auto}
.nav button{padding:11px 14px 9px;font:600 var(--text-md) var(--font-display);letter-spacing:.02em;color:var(--color-ink-2);border-bottom:3px solid transparent;white-space:nowrap}
.nav button:hover{color:var(--color-ink)}
.nav button.on{color:var(--color-ink);border-bottom-color:var(--color-ink)}
.nav .badge[hidden]{display:none}
.nav .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:var(--radius);background:var(--color-alarm);color:var(--color-ink-inv);font:600 11px/18px var(--font-body);text-align:center}

main{padding:var(--space-md) var(--space-md) var(--space-xl);max-width:1400px;width:100%;margin:0 auto}
.view[hidden]{display:none}
.grid{display:grid;gap:var(--space-sm)}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr))}
.g-main{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
@media (max-width:960px){.g-main{grid-template-columns:minmax(0,1fr)}}
.stack{display:grid;gap:var(--space-sm)}

/* panels: one hairline, no shadow, no nesting */
.card{background:var(--color-panel);border:1px solid var(--color-rule);border-radius:var(--radius);min-width:0}
.card-hd{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-sm);padding:var(--space-sm) var(--space-md) 0;flex-wrap:wrap}
.card-hd .hint{font-size:var(--text-sm);color:var(--color-ink-3)}
.card-bd{padding:var(--space-xs) var(--space-md) var(--space-md)}
.card-bd.flush{padding:var(--space-2xs) 0}
.lead{font-size:var(--text-md);color:var(--color-ink-2);max-width:72ch}
.small{font-size:var(--text-sm);color:var(--color-ink-2)}
.muted{color:var(--color-ink-3)}
hr.sep{border:0;border-top:1px solid var(--color-rule-2);margin:var(--space-sm) 0}

/* ---------- state labels: text, not candy ---------- */
.pat{display:inline-block;font:600 9.5px/1.4 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;padding:0 4px;border:1px solid var(--color-rule);border-radius:2px;color:var(--color-ink-2);white-space:nowrap;vertical-align:1px}
.pat-soft{border-style:dashed;color:var(--color-model);border-color:var(--color-model)}
.pat-demo{color:var(--color-warn);border-color:var(--color-warn)}
.st{display:inline-flex;align-items:center;gap:5px;font:600 var(--text-xs)/1.5 var(--font-body);white-space:nowrap;color:var(--color-ink-2)}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-ok{color:var(--color-signal-ink)} .st-warn{color:var(--color-warn)} .st-bad{color:var(--color-alarm)}
.st-info{color:var(--color-data)} .st-off{color:var(--color-ink-3)}

/* ---------- the answer ---------- */
.decide{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-md);align-items:end;padding:var(--space-md) var(--space-md) var(--space-md);background:var(--color-panel);border:1px solid var(--color-rule);border-top:4px solid var(--color-ink-3);border-radius:var(--radius)}
.decide .ico{display:none}
.decide.go{border-top-color:var(--color-signal)}
.decide.sched{border-top-color:var(--color-data)}
.decide.hold{border-top-color:var(--color-warn)}
.decide h1{font:700 var(--text-2xl)/1.15 var(--font-display);letter-spacing:.01em;margin:2px 0 6px;overflow-wrap:anywhere}
.decide .why{font-size:var(--text-md);color:var(--color-ink-2);max-width:80ch}
.decide .acts{display:flex;gap:var(--space-xs);flex-wrap:wrap;justify-content:flex-end}
@media (max-width:700px){.decide{grid-template-columns:minmax(0,1fr)}.decide .acts{justify-content:flex-start}.decide h1{font-size:var(--text-xl)}}

.btn{height:34px;padding:0 var(--space-md);border-radius:var(--radius);border:1px solid var(--color-rule);background:var(--color-panel);font-size:var(--text-sm);font-weight:600;white-space:nowrap;transition:background-color var(--dur-short) var(--ease-out)}
.btn:hover{background:var(--color-panel-2)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--color-ink);border-color:var(--color-ink);color:var(--color-ink-inv)}
.btn.pri:hover{background:oklch(32% 0.07 262)}
.btn.go{background:var(--color-signal);border-color:var(--color-signal);color:var(--color-ink)}
.btn.go:hover{background:oklch(72% 0.17 128)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- readings ---------- */
.tiles{display:grid;gap:0;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));background:var(--color-panel);border:1px solid var(--color-rule);border-radius:var(--radius);overflow:hidden}
.tile{padding:var(--space-sm) var(--space-md);display:grid;gap:2px;min-width:0;text-align:left;border-right:1px solid var(--color-rule-2);border-bottom:1px solid var(--color-rule-2);margin:0 -1px -1px 0}
.tile .hd{display:flex;justify-content:space-between;align-items:center;gap:6px}
.tile .tag{font:600 10px var(--font-mono);color:var(--color-ink-3)}
.tile .nm{font-size:var(--text-sm);color:var(--color-ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .val{font:700 30px/1.05 var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.tile .val small{font:500 var(--text-sm) var(--font-body);color:var(--color-ink-3);margin-left:4px}
.tile svg.spark{width:100%;height:26px;display:block}
.tile .lim{font-size:10.5px;color:var(--color-ink-3)}
.tile.warn{background:var(--color-warn-bg)} .tile.warn .val{color:var(--color-warn)}
.tile.alarm{background:var(--color-alarm-bg)} .tile.alarm .val{color:var(--color-alarm)}
.tile.stale .val{color:var(--color-ink-3)}
.tile.soft .tag::after{content:" · calc";color:var(--color-model)}

/* ---------- switches ---------- */
.act{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px var(--space-sm);align-items:center;padding:var(--space-sm) var(--space-md);border-top:1px solid var(--color-rule-2)}
.act:first-child{border-top:0}
.act .nm{font:700 var(--text-lg) var(--font-display)}
.act .sub{font-size:var(--text-sm);color:var(--color-ink-2);grid-column:1/-1}
.sw{position:relative;width:54px;height:28px;border-radius:var(--radius);background:var(--color-panel-2);border:1px solid var(--color-rule);transition:background-color var(--dur-short) var(--ease-out)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:2px;background:var(--color-ink-3);transition:transform var(--dur-short) var(--ease-out),background-color var(--dur-short) var(--ease-out)}
.sw.on{background:var(--color-signal);border-color:var(--color-signal)} .sw.on::after{transform:translateX(26px);background:var(--color-ink)}
.sw.valve.on{background:var(--color-data);border-color:var(--color-data)} .sw.valve.on::after{background:var(--color-ink-inv)}
.sw:disabled{opacity:.5;cursor:not-allowed}

/* ---------- key/value, tables ---------- */
.kv{display:flex;justify-content:space-between;gap:var(--space-sm);padding:6px 0;border-top:1px solid var(--color-rule-2);font-size:var(--text-md)}
.kv:first-child{border-top:0}
.kv .k{color:var(--color-ink-2)}
.kv .v{font-family:var(--font-num);font-variant-numeric:tabular-nums;text-align:right}
.tbl{width:100%;border-collapse:collapse;font-size:var(--text-sm)}
.tbl th{text-align:left;font:600 var(--text-xs) var(--font-body);color:var(--color-ink-3);letter-spacing:.04em;padding:6px var(--space-md);border-bottom:1px solid var(--color-rule);white-space:nowrap}
.tbl td{padding:7px var(--space-md);border-bottom:1px solid var(--color-rule-2);vertical-align:top}
.tbl td.n{font-family:var(--font-num);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl-wrap{overflow-x:auto}

/* ---------- figures: a row of numbers split by hairlines, not boxes ---------- */
.metrics{display:grid;gap:var(--space-sm) var(--space-lg);grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.metric{padding:var(--space-2xs) 0 0;border-top:1px solid var(--color-rule-2)}
.metric .k{font-size:var(--text-xs);color:var(--color-ink-3)}
.metric .v{font:700 var(--text-xl)/1.2 var(--font-num);font-variant-numeric:tabular-nums}
.metric .v small{font:500 var(--text-xs) var(--font-body);color:var(--color-ink-3)}
.metric .s{font-size:var(--text-xs);color:var(--color-ink-2)}

/* ---------- charts ---------- */
svg.chart{width:100%;height:auto;display:block;font-family:var(--font-body)}
svg.chart .ax{stroke:var(--color-rule);stroke-width:1}
svg.chart .grid{stroke:var(--color-rule-2);stroke-width:1}
svg.chart text{fill:var(--color-ink-3);font-size:11px;font-family:var(--font-num)}
svg.chart .lbl{fill:var(--color-ink-2);font:11.5px var(--font-body)}
.legend{display:flex;gap:var(--space-md);flex-wrap:wrap;font-size:var(--text-sm);color:var(--color-ink-2);padding:var(--space-2xs) 0}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:3px;margin-right:6px}
.legend i.dot{width:8px;height:8px;border-radius:50%;vertical-align:0}
.legend i.band{height:9px;vertical-align:-1px;opacity:.4}

/* ---------- twin status ---------- */
.verdict{font-size:var(--text-md);color:var(--color-ink);padding-top:var(--space-sm);border-top:1px solid var(--color-rule-2)}
.tests{display:grid;gap:0;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.test{display:grid;gap:3px;padding:var(--space-2xs) var(--space-md) var(--space-sm) var(--space-md);border-left:1px solid var(--color-rule-2)}
.test:first-child{border-left:0;padding-left:0}
.test .h{display:flex;justify-content:space-between;align-items:center;gap:var(--space-xs);font:700 var(--text-md) var(--font-display)}
.test .e{font-size:var(--text-sm);color:var(--color-ink-2)}
.note{font-size:var(--text-sm);color:var(--color-ink-2);background:var(--color-panel-2);border-radius:var(--radius);padding:var(--space-xs) var(--space-sm)}
.note.warn{background:var(--color-warn-bg)}
.field{display:grid;gap:3px;font-size:var(--text-sm);color:var(--color-ink-2)}
.field input,.field select{height:34px;padding:0 var(--space-xs);border:1px solid var(--color-rule);border-radius:var(--radius);background:var(--color-panel);font:var(--text-md) var(--font-num);color:var(--color-ink)}
.fields{display:grid;gap:var(--space-sm);grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.log{max-height:280px;overflow:auto;font-size:var(--text-sm)}
.log .row{display:grid;grid-template-columns:52px 104px minmax(0,1fr);gap:var(--space-xs);padding:6px var(--space-md);border-top:1px solid var(--color-rule-2)}
.log .row:first-child{border-top:0}
.log .t{font-family:var(--font-num);color:var(--color-ink-3)}
.empty{padding:var(--space-md);color:var(--color-ink-3);font-size:var(--text-sm)}
.alarm-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-sm);align-items:center;padding:var(--space-xs) var(--space-md);border-top:1px solid var(--color-rule-2)}
.alarm-row:first-child{border-top:0}
.pri-1{color:var(--color-alarm);font:700 var(--text-md) var(--font-display)} .pri-2{color:var(--color-warn);font:700 var(--text-md) var(--font-display)}
details.card>summary{list-style:none}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary h2::before{content:"+ ";color:var(--color-ink-3)}
details.card[open]>summary h2::before{content:"− "}

/* ---------- system map ---------- */
.map-ctl{display:flex;align-items:center;gap:var(--space-xs);flex-wrap:wrap}
.map-box{height:calc(100vh - 280px);min-height:300px;padding:0 var(--space-xs)}
.map-box svg{width:100%;height:100%;display:block}
.m-pipe{fill:none;stroke:var(--color-pipe);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.m-flow{fill:none;stroke:transparent;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.m-flow.on{stroke:var(--color-data);stroke-dasharray:12 9;animation:mflow .9s linear infinite}
@keyframes mflow{to{stroke-dashoffset:-21}}
@media (prefers-reduced-motion:reduce){.m-flow.on{animation:none;stroke-dasharray:none}.status.alarm .dot{animation:none}}
.m-eq{fill:var(--color-panel);stroke:var(--color-ink-2);stroke-width:1.6}
.m-fibre{stroke:var(--color-ink-3);stroke-width:1.1}
.m-arrow{fill:none;stroke:var(--color-model);stroke-width:1.8;stroke-linecap:round}
.m-liquid{fill:var(--color-panel-2)}
.m-glow{fill:none;stroke:transparent;stroke-width:0}
.m-glow.on{fill:var(--color-signal-bg);stroke:var(--color-signal);stroke-width:1.5}
.m-led{fill:var(--color-rule)}.m-led.on{fill:var(--color-signal)}
.m-pumpsym{fill:none;stroke:var(--color-ink-2);stroke-width:1.6;stroke-linejoin:round}
.m-valve{stroke:var(--color-ink);stroke-width:1.6}.m-valve.open{fill:var(--color-panel)}.m-valve.shut{fill:var(--color-ink)}
.m-hot{cursor:pointer;outline:none}
.m-hot:hover .m-eq,.m-hot:focus .m-eq,.m-hot:hover .m-valve,.m-hot:focus .m-valve{stroke:var(--color-focus);stroke-dasharray:4 3;stroke-width:2.2}
.m-bub{fill:var(--color-panel);stroke:var(--color-ink-2);stroke-width:1.4}
.m-lead{stroke:var(--color-ink-3);stroke-width:1.2}
.m-warn .m-bub{fill:var(--color-warn-bg);stroke:var(--color-warn)}.m-bad .m-bub{fill:var(--color-alarm-bg);stroke:var(--color-alarm)}
#map-svg text{font-family:var(--font-body)}
.m-tag{font:600 10px var(--font-mono);fill:var(--color-ink)}
.m-val{font:700 15px var(--font-num);fill:var(--color-ink)}
.m-sub{font-size:11px;fill:var(--color-ink-2)}
.m-name{font:700 13px var(--font-display);fill:var(--color-ink);letter-spacing:.02em}
.m-ctl{font-size:12px;font-weight:600;fill:var(--color-data)}

@media (max-width:640px){
  .top{padding:var(--space-xs) var(--space-sm)}.tfield{display:none}
  main{padding:var(--space-sm) var(--space-sm) var(--space-lg)}
  .tile .val{font-size:26px}
  .map-box{height:auto;min-height:0}
  .test{border-left:0;padding-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

var LANG = lsGet("releaf.lang")==="zh" ? "zh" : "en";
function L(en,zh){ return LANG==="zh" ? zh : en; }
function N(pair){ return pair ? (LANG==="zh" ? pair[1] : pair[0]) : ""; }
var DICT = {
  "brand.sub":["GEMs Taiwan · hollow-fibre bioreactor","GEMs Taiwan · 中空纖維生物反應器"],
  "top.run":["Run time","運行時間"], "top.clock":["Clock","時鐘"], "top.stop":["SAFE STATE","安全狀態"],
  "nav.today":["Today","今天"], "nav.twin":["Growth twin","生長孿生"],

};

  document.documentElement.lang = LANG==="zh" ? "zh-Hant" : "en";
  [].forEach.call(document.querySelectorAll("[data-t]"), function(n){ var d=DICT[n.dataset.t]; if(d) n.textContent=d[LANG==="zh"?1:0]; });
  [].forEach.call(document.querySelectorAll("[data-lang]"), function(b){ b.classList.toggle("on", b.dataset.lang===LANG); });
}
function $(s,r){ return (r||document).querySelector(s); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function fmt(v,d){ return (v==null||!isFinite(v)) ? "—" : Number(v).toFixed(d==null?2:d); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function pad(n){ return (n<10?"0":"")+n; }
function hm(ms){ var d=new Date(ms); return pad(d.getHours())+":"+pad(d.getMinutes()); }
function dayHm(ms){
  var d=new Date(ms), now=new Date(nowT());
  var same = d.toDateString()===now.toDateString();
  var tmr = new Date(now.getTime()+864e5).toDateString()===d.toDateString();
  return (same ? L("today ","今天 ") : tmr ? L("tomorrow ","明天 ") : (d.getMonth()+1)+"/"+d.getDate()+" ")+hm(ms);
}
function durH(h){ if(h==null||!isFinite(h)) return "—"; var H=Math.floor(h), M=Math.round((h-H)*60); if(M===60){H++;M=0;} return H+"h "+pad(M)+"m"; }
function iso(ms){ return new Date(ms).toISOString(); }
function median(a){ if(!a.length) return null; var s=a.slice().sort(function(x,y){return x-y;}), m=s.length>>1; return s.length%2 ? s[m] : (s[m-1]+s[m])/2; }
function randn(){ var u=0,v=0; while(!u)u=Math.random(); while(!v)v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function pct(a,p){ var s=a.slice().sort(function(x,y){return x-y;}); var i=(s.length-1)*p, lo=Math.floor(i), hi=Math.ceil(i); return s[lo]+(s[hi]-s[lo])*(i-lo); }

/* ================================================================
   1. THE PLANT AS OF 21 OCTOBER
   Seven measured channels, two soft (computed) ones, two actuators.
   PAT class after the FDA PAT guidance: IN-LINE = sensor in the stream;
   SOFT = no instrument, a model produces the number.
   ================================================================ */
var PSI_BAR = 0.0689476;
var CH = {
  od:  {tag:"AT-01", n:["Cell density","細胞密度"], unit:"OD600", dec:3, min:0, max:2, pat:"in",
        src:["Inline photometer on the lumen loop","內腔迴路管線內光度計"]},
  ph:  {tag:"AT-02", n:["pH, lumen","pH（內腔）"], unit:"pH", dec:2, min:5.5, max:8.5, lo:6.4, hi:7.6, wlo:6.6, whi:7.4, pat:"in",
        src:["pH probe in the lumen loop","內腔迴路 pH 探針"]},
  flow:{tag:"FT-01", n:["Loop flow","迴路流量"], unit:"mL/min", dec:0, min:0, max:460, lo:80, whi:430, pat:"in",
        src:["Flow meter; pump speed is set by hand","流量計；幫浦轉速手動設定"]},
  tmp: {tag:"PDT-01", n:["Trans-membrane pressure","跨膜壓差"], unit:"bar", dec:3, min:-0.1, max:0.7, hi:0.5, whi:0.4, pat:"soft",
        src:["Computed: mean(PT-01, PT-03) − mean(PT-04, PT-05)","計算值：平均(PT-01, PT-03) − 平均(PT-04, PT-05)"]},
  pt1: {tag:"PT-01", n:["Lumen in","內腔進口"],  unit:"psi", dec:2, min:0, max:10, whi:8, pat:"in", src:["Pressure transducer","壓力傳感器"]},
  pt3: {tag:"PT-03", n:["Lumen out","內腔出口"], unit:"psi", dec:2, min:0, max:10, whi:8, pat:"in", src:["Pressure transducer","壓力傳感器"]},
  pt4: {tag:"PT-04", n:["Shell out (top)","殼側出口（上）"],  unit:"psi", dec:2, min:0, max:10, pat:"in", src:["Pressure transducer","壓力傳感器"]},
  pt5: {tag:"PT-05", n:["Shell in (bottom)","殼側進口（下）"], unit:"psi", dec:2, min:0, max:10, pat:"in", src:["Pressure transducer","壓力傳感器"]},
  foul:{tag:"FI-01", n:["Fouling ratio","堵塞比"], unit:"×", dec:2, min:0.5, max:3, hi:2.0, whi:1.5, pat:"soft",

};
var MEASURED = ["od","ph","flow","pt1","pt3","pt4","pt5"];
var TILES = ["od","ph","flow","tmp","foul","pt1","pt3","pt4","pt5"];

function saveCfg(){ lsSet("releaf.cfg", JSON.stringify(CFG)); }

var S = {
  mode:"demo",                    /* demo | live */
  runStart: Date.now(), simH:0,   /* demo: virtual process hours */
  pv:{}, pvT:{},                  /* value and wall time of last update */
  hist:{}, lastHistH:-1,
  act:{valve:"OPEN", light:"OFF"},

  foulBase:null, foulBaseN:[], view:"today",
  bubbles:0, lastAutoH:-99
};

function hNow(){ return S.mode==="live" ? (Date.now()-S.runStart)/3.6e6 : S.simH; }
/* Virtual clock. In demo the process runs faster than the wall, and the
   weather forecast is read at the process's own time, so the decision and
   the culture live on one clock. */
function nowT(){ return S.runStart + hNow()*3.6e6; }

  S.audit.unshift({t:nowT(), h:hNow(), who:who, what:what, why:why, mode:S.mode});
  if(S.audit.length>500) S.audit.pop();
}

/* ================================================================

   twin has something to discover. Every screen says DEMO while it runs.
   ================================================================ */
var DEMO = { X0:0.03, r:0.26, K:1.30, foul:1.0, bubbleUntil:-1 };
function logistic(t,X0,r,K){ return K/(1+((K-X0)/X0)*Math.exp(-r*t)); }
function dpNet(q){ q=Math.max(0,q); return 2.427e-4*q + 4.604e-7*q*q; }   /* bar, clean module, 22 °C */
function demoStep(dtH){

    D.h = S.act.light==="GREEN" ? L("No crop stress ahead. The green light can go off","72 小時內沒有需求，綠光可以關閉")
                                : L("Keep the green light off","綠光保持關閉");
    D.why = L("Highest crop-stress risk in the next 72 h is ","未來 72 小時最高作物逆境風險為 ")+Math.round((peak?peak.risk.v:0)*100)+"%"+
            (peak?L(" ("+N(DRV[peak.risk.top])+", "+dayHm(peak.t)+")", "（"+N(DRV[peak.risk.top])+"，"+dayHm(peak.t)+"）"):"")+
            L(", below the "+Math.round(CFG.thr*100)+"% demand threshold.","，低於 "+Math.round(CFG.thr*100)+"% 的需求門檻。");
    return D;
  }
  var tOn = need.t - Lh*3.6e6; D.tOn=tOn;
  var needTxt = L("Crop stress "+Math.round(need.risk.v*100)+"% ("+N(DRV[need.risk.top])+") expected "+dayHm(need.t),
                  "預計 "+dayHm(need.t)+" 作物逆境 "+Math.round(need.risk.v*100)+"%（"+N(DRV[need.risk.top])+"）");
  var ready = od!=null && od>=CFG.odMin;
  var tt = !ready ? GT.timeTo(CFG.odMin) : null;
  D.readyAt = tt ? t + tt.h*3.6e6 : null;
  if(S.act.light==="GREEN"){ D.act="KEEP"; D.cls="go";
    D.h=L("Green light is on, as needed","綠光已開，符合需求"); D.why=needTxt+"."; return D; }
  if(t>=tOn){
    if(ready){ D.act="GO"; D.cls="go"; D.h=L("Switch the green light on now","現在開啟綠光");
      D.why=needTxt+L(". Lead time "+fmt(Lh,1)+" h has started; culture at OD "+fmt(od,2)+" ≥ "+fmt(CFG.odMin,2)+".",
                     "。"+fmt(Lh,1)+" 小時的前置時間已開始；菌體 OD "+fmt(od,2)+" ≥ "+fmt(CFG.odMin,2)+"。"); }
    else { D.act="WAIT"; D.cls="hold"; D.h=L("Demand is due but the culture is not ready","需求將至，但菌體尚未就緒");
      D.why=needTxt+L(". OD "+fmt(od,2)+" < "+fmt(CFG.odMin,2)+"; "+(!tt?"the growth model needs more data before it can say when it will be":isFinite(tt.h)?"the growth model expects it at "+dayHm(D.readyAt):"the growth model says it will not reach it at the current plateau")+".",
                     "。OD "+fmt(od,2)+" < "+fmt(CFG.odMin,2)+"；"+(!tt?"生長模型需要更多數據才能預估":isFinite(tt.h)?"生長模型預估於 "+dayHm(D.readyAt)+" 達到":"生長模型判斷在目前平台期不會達到")+"。"); }
  } else {
    D.act="SCHED"; D.cls="sched"; D.h=L("Switch green on at "+dayHm(tOn),"於 "+dayHm(tOn)+" 開啟綠光");
    D.why=needTxt+L(", minus lead time "+fmt(Lh,1)+" h.","，減去 "+fmt(Lh,1)+" 小時前置時間。")+
      (!ready && D.readyAt ? (D.readyAt>tOn ? L(" Warning: culture predicted to reach OD "+fmt(CFG.odMin,2)+" only at "+dayHm(D.readyAt)+", too late."," 注意：菌體預估 "+dayHm(D.readyAt)+" 才達 OD "+fmt(CFG.odMin,2)+"，會來不及。")
                                           : L(" Culture predicted ready at "+dayHm(D.readyAt)+"."," 菌體預估於 "+dayHm(D.readyAt)+" 就緒。")) : "");
  }
  return D;
}
var LAST_D=null;
function autoAct(D){
  if(CFG.lightMode!=="AUTO") return;
  if(!D.tr.ok || !D.tr.model) return;                     /* AUTO acts only on a model that passed */
  if(hNow()-S.lastAutoH < 0.5) return;                    /* anti-chatter: one move per 30 min */
  if(D.act==="GO" && S.act.light!=="GREEN"){ setLight("GREEN","twin-auto",D.h+" — "+D.why); S.lastAutoH=hNow(); }
  else if(D.act==="OFF" && S.act.light==="GREEN"){ setLight("OFF","twin-auto",D.h+" — "+D.why); S.lastAutoH=hNow(); }
}

/* ================================================================
   8. ACTUATORS, INTERLOCKS, SAFE STATE
   The MCU owns the real interlocks; the page mirrors them so the operator
   sees the same rule the board applies.
   ================================================================ */
function setLight(v, who, why){ if(S.act.light===v) return; S.act.light=v; audit(who,"L-01 → "+v,why); sendToBoard(); renderAll(); }
function setValve(v, who, why){ if(S.act.valve===v) return; S.act.valve=v; audit(who,"XV-01 → "+v,why); sendToBoard(); renderAll(); }
function interlocks(){
  if(S.act.valve==="CLOSED" && S.pv.tmp>CH.tmp.hi)
    setValve("OPEN","interlock",L("IL-1: TMP "+fmt(S.pv.tmp,3)+" bar > "+CH.tmp.hi+" bar with the lumen valve shut","IL-1：內腔閥關閉時 TMP "+fmt(S.pv.tmp,3)+" bar > "+CH.tmp.hi+" bar"));
}
function safeState(){
  CFG.lightMode="MANUAL"; saveCfg();
  S.act.valve="OPEN"; S.act.light="OFF";
  audit("operator","SAFE STATE",L("Valve open, light off, light mode set to Manual","閥開啟、燈關閉、燈光模式改為手動"));
  sendToBoard(); renderAll();
}

/* ================================================================
   9. BOARD LINK · Web Serial, 115200 baud, one line per message
     in  : PV OD=0.412 PH=7.02 FLOW=263 PT1=2.69 PT3=1.31 PT4=0.45 PT5=0.35
     out : SET XV01=OPEN LIGHT=GREEN        (every 2 s, heartbeat)
   The firmware's 5 s link timeout puts the rig in its safe state if the
   page stops talking. Fields the page does not recognise are ignored.
   ================================================================ */
var port=null, writer=null, reader=null, readAbort=false;
function liveIn(){ return S.link.on && S.link.lastIn && (Date.now()-S.link.lastIn<5000); }
function startRun(mode){
  S.mode=mode; S.runStart=Date.now(); S.simH=0; S.lastHistH=-1; S.nextLogH=0;
  TILES.forEach(function(k){ S.hist[k]=[]; S.pv[k]=null; S.pvT[k]=null; });
  S.foulBase=null; S.foulBaseN=[]; S.bubbles=0; S.log=[]; S.lastAutoH=-99;
  DEMO.foul=1.0; GT.reset(); S.board={valve:null, light:null, lock:"NONE", upS:null}; LAST_OD_COUNTS=null;
  audit("operator", L("Run started","開始運行"), mode==="live"?L("Live board","實機連線"):L("Demo plant","示範模型"));
}
async function toggleLink(){
  if(S.link.on){
    readAbort=true;
    try{ if(reader) await reader.cancel(); }catch(e){}
    try{ if(writer){ writer.releaseLock(); } if(port) await port.close(); }catch(e){}
    port=writer=reader=null; S.link.on=false;
    audit("operator",L("Board disconnected","中斷板子連線"),"");
    startRun("demo"); renderAll(); return;
  }
  if(!("serial" in navigator)){ alert(L("This browser has no Web Serial. Use Chrome or Edge.","此瀏覽器不支援 Web Serial，請用 Chrome 或 Edge。")); return; }
  try{
    port = await navigator.serial.requestPort();
    await port.open({baudRate:115200});
    writer = port.writable.getWriter();
    readAbort=false; S.link.on=true;
    startRun("live"); readLoop(); sendCal(); sendToBoard();
    audit("operator",L("Board connected","連上板子"),"");
  }catch(err){ if(err && err.name==="NotFoundError") return; alert(L("Could not open the port: ","無法開啟連接埠：")+err); }
  renderAll();
}
function sendToBoard(){
  if(!S.link.on || !writer) return;
  var line="SET XV01="+S.act.valve+" LIGHT="+S.act.light+"\n";
  S.link.lastOut=Date.now(); S.link.outN++; S.link.lastOutLine=line.trim();
  writer.write(new TextEncoder().encode(line)).catch(function(){ S.link.on=false; audit("system",L("Write failed, link dropped","寫入失敗，連線中斷"),""); });
}
/* The operator calibrates on the page; the board turns counts into OD and pH.
   The page holds the numbers and pushes them down on connect and on every
   recalibration, so a freshly reflashed board is never silently stale. */
function sendCal(){
  if(!S.link.on || !writer) return;
  var line="CAL ODBLANK="+(CAL.odCounts||0).toFixed(1)+" PHSLOPE="+CAL.phSlope.toFixed(3)+" PHOFF="+CAL.phOffset.toFixed(3)+"\n";
  writer.write(new TextEncoder().encode(line)).catch(function(){});
  S.link.lastOut=Date.now(); S.link.outN++;
}
async function readLoop(){
  var dec=new TextDecoder(), buf="";
  try{
    reader=port.readable.getReader();
    while(!readAbort){
      var r=await reader.read(); if(r.done) break;
      buf+=dec.decode(r.value,{stream:true});
      var i; while((i=buf.indexOf("\n"))>=0){ acceptLine(buf.slice(0,i).replace(/\r$/,"").trim()); buf=buf.slice(i+1); }
      if(buf.length>4096) buf="";
    }
  }catch(e){ if(!readAbort){ S.link.on=false; audit("system",L("Serial read failed","序列讀取失敗"),String(e)); } }
  try{ if(reader) reader.releaseLock(); }catch(e){}
}
var PV_KEYS={OD:"od",PH:"ph",FLOW:"flow",Q:"flow",PT1:"pt1",PT3:"pt3",PT4:"pt4",PT5:"pt5"};
/* The board sends three kinds of line. PV carries readings; a channel whose
   sensor is dead is simply absent, so a missing key clears that reading rather
   than freezing the last one on screen. ST says what the board is ACTUALLY
   doing, which differs from what we asked whenever an interlock holds it.
   EV is free text for the log. */
function acceptLine(line){
  if(line.indexOf("PV")===0) return acceptPV(line);
  if(line.indexOf("ST")===0) return acceptST(line);
  if(line.indexOf("EV")===0){
    var t=line.slice(2).trim();
    if(t && t!==S.link.lastEv){ S.link.lastEv=t; audit("board",L("Board event","板子事件"),t); }
    S.link.lastIn=Date.now(); S.link.inN++; S.link.lastLine=line;
  }
}
function acceptPV(line){
  var got=0, seen={};
  line.slice(2).trim().split(/\s+/).forEach(function(tok){
    var e=tok.indexOf("="); if(e<1) return;
    var key=tok.slice(0,e), v=parseFloat(tok.slice(e+1));
    if(!isFinite(v)) return;
    if(key==="ODC"){ LAST_OD_COUNTS=v; got++; return; }   /* raw counts, for zeroing */
    var k=PV_KEYS[key];
    if(k){ acceptValue(k,v); seen[k]=1; got++; }
  });
  /* a channel the board stopped sending is unknown, not unchanged */
  if(got) MEASURED.forEach(function(k){ if(!seen[k]){ S.pv[k]=null; S.pvT[k]=null; } });
  if(got){ S.link.lastIn=Date.now(); S.link.inN++; S.link.lastLine=line; }
}
function acceptST(line){
  var st={};
  line.slice(2).trim().split(/\s+/).forEach(function(tok){
    var e=tok.indexOf("="); if(e>0) st[tok.slice(0,e)]=tok.slice(e+1);
  });
  if(st.XV01) S.board.valve=st.XV01;
  if(st.LIGHT) S.board.light=st.LIGHT;
  if(st.LOCK!==undefined){
    if(st.LOCK!==S.board.lock && st.LOCK!=="NONE")
      audit("interlock", st.LOCK==="TMP"?L("IL-1 membrane pressure","IL-1 膜壓")
                        :st.LOCK==="LINK"?L("IL-2 link lost","IL-2 連線中斷"):st.LOCK,
            L("the board overrode the commanded state","板子覆蓋了指令狀態"));
    S.board.lock=st.LOCK;
  }
  if(st.UP!==undefined) S.board.upS=+st.UP;
  S.link.lastIn=Date.now(); S.link.inN++; S.link.lastLine=line;
}

/* ================================================================
   10. ALARMS
   ================================================================ */
function evalAlarms(){
  var p=S.pv, A=[], open=S.act.valve==="OPEN";
  function add(id,pri,en,zh){ A.push({id:id,pri:pri,t:L(en,zh)}); }
  if(S.mode==="live" && S.link.on && !liveIn()) add("stale",1,"No data from the board for over 5 s","板子超過 5 秒沒有數據");
  if(p.tmp>CH.tmp.hi) add("tmp_hi",1,"TMP above "+CH.tmp.hi+" bar: membrane at risk","TMP 高於 "+CH.tmp.hi+" bar：薄膜有風險");
  else if(p.tmp>CH.tmp.whi) add("tmp_w",2,"TMP above "+CH.tmp.whi+" bar","TMP 高於 "+CH.tmp.whi+" bar");
  if(p.tmp<-0.02 && p.flow>50) add("tmp_neg",2,"Negative TMP: back-flow or a pressure offset","TMP 為負：逆流或壓力零點偏移");
  if(p.ph!=null){ if(p.ph<CH.ph.lo||p.ph>CH.ph.hi) add("ph",1,"pH "+fmt(p.ph,2)+" outside "+CH.ph.lo+"–"+CH.ph.hi,"pH "+fmt(p.ph,2)+" 超出 "+CH.ph.lo+"–"+CH.ph.hi);
    else if(p.ph<CH.ph.wlo||p.ph>CH.ph.whi) add("ph_w",2,"pH "+fmt(p.ph,2)+" drifting","pH "+fmt(p.ph,2)+" 偏移中"); }
  if(open && p.flow!=null && p.flow<CH.flow.lo) add("flow_lo",2,"Loop flow under "+CH.flow.lo+" mL/min with the valve open. Pump stopped or line blocked?","閥開啟時流量低於 "+CH.flow.lo+" mL/min。幫浦停了或管路堵塞？");
  if(p.flow>50 && open && p.pt1<p.pt3-0.05) add("pt_order",2,"PT-01 reads below PT-03 while flowing: swapped or offset sensor","流動時 PT-01 低於 PT-03：感測器接反或偏移");
  if(p.foul>CH.foul.hi) add("foul",1,"Fouling ratio "+fmt(p.foul,2)+"×. Clean the membrane","堵塞比 "+fmt(p.foul,2)+"×，請清洗薄膜");
  else if(p.foul>CH.foul.whi) add("foul_w",2,"Fouling ratio "+fmt(p.foul,2)+"×","堵塞比 "+fmt(p.foul,2)+"×");
  var sk=GT.skill(); if(sk && sk.nrmse!=null && sk.nrmse>0.15) add("model",2,"Growth model 2 h forecast NRMSE "+fmt(sk.nrmse*100,0)+"% > 15 %","生長模型 2 小時預測 NRMSE "+fmt(sk.nrmse*100,0)+"% > 15%");
  if(S.mode==="live" && S.board.lock && S.board.lock!=="NONE" && S.board.lock!=="LINK")
    add("lock",1,"Interlock "+S.board.lock+" is holding the rig. The board overrode the command","連鎖 "+S.board.lock+" 作用中，板子已覆蓋指令");
  if(WX.src==="snapshot") add("wx",2,"Weather offline. Using the stored 6 Sep snapshot","天氣離線，使用 9/6 的舊快照");
  var prev={}; S.alarms.forEach(function(a){ prev[a.id]=a.since; });
  A.forEach(function(a){ a.since = prev[a.id] || nowT(); if(!prev[a.id]) audit("alarm","P"+a.pri+" "+a.id,a.t); });
  Object.keys(S.acked).forEach(function(id){ if(!A.some(function(a){return a.id===id;})) delete S.acked[id]; });
  S.alarms=A.sort(function(a,b){return a.pri-b.pri;});
}

/* ================================================================
   11. RECORDING
   One row per 5 process-minutes. Every column names its unit, and the
   metadata file carries calibration, model version and the prior, so a
   reader can reconstruct what the twin knew when it acted (ALCOA+).
   ================================================================ */
var LOG_DT_H=1/12;
var COLS=["time_iso","run_h","od600","ph","flow_ml_min","pt01_psi","pt03_psi","pt04_psi","pt05_psi","tmp_bar","fouling_ratio",
          "valve_xv01","light_l01","light_mode","source","model_od_fit","model_r_per_h","model_K","model_nrmse_2h","decision"];
function logRow(){
  var h=hNow(); if(h<S.nextLogH) return; S.nextLogH=h+LOG_DT_H;
  var p=S.pv, P=GT.params(), sk=GT.skill(), D=LAST_D;
  S.log.push([iso(nowT()), h.toFixed(4), fmt(p.od,4), fmt(p.ph,3), fmt(p.flow,1), fmt(p.pt1,3), fmt(p.pt3,3), fmt(p.pt4,3), fmt(p.pt5,3),
    fmt(p.tmp,4), fmt(p.foul,3), S.act.valve, S.act.light, CFG.lightMode, S.mode,
    P?fmt(GT.f(h,GT.q),4):"", P?fmt(P.r,4):"", P?fmt(P.K,4):"", sk&&sk.nrmse!=null?fmt(sk.nrmse,4):"", D?D.act:""]);
  if(S.log.length>50000) S.log.shift();
}
function csv(rows){ return rows.map(function(r){ return r.map(function(v){ v=String(v==null?"":v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(","); }).join("\n"); }
function save(name, text, mime){
  var b=new Blob([text],{type:mime||"text/csv"}), a=document.createElement("a");
  a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function stamp(){ var d=new Date(S.runStart); return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"_"+pad(d.getHours())+pad(d.getMinutes()); }
function exportLog(){ save("BR01_"+stamp()+"_"+S.mode+"_process.csv", csv([COLS].concat(S.log))); }
function exportAudit(){ save("BR01_"+stamp()+"_"+S.mode+"_audit.csv", csv([["time_iso","run_h","who","what","why","source"]].concat(S.audit.slice().reverse().map(function(a){ return [iso(a.t),a.h.toFixed(4),a.who,a.what,a.why,a.mode]; })))); }
function exportMeta(){
  save("BR01_"+stamp()+"_"+S.mode+"_meta.json", JSON.stringify({
    rig:"ReLeaf BR-01 hollow-fibre bioreactor", ui_build:"0924UI 2026-09-24", source:S.mode,
    run_start:iso(S.runStart), exported:iso(Date.now()),
    channels:Object.keys(CH).map(function(k){ return {key:k, tag:CH[k].tag, name:CH[k].n[0], unit:CH[k].unit, pat_class:CH[k].pat, source:CH[k].src[0]}; }),
    calibration:{od_blank:CAL.odBlank, od_blank_when:CAL.odWhen, ph_calibrated:CAL.phWhen, od_plate_to_inline_scale:CFG.odScale},
    growth_model:{form:"logistic X(t)=K/(1+((K-X0)/X0)exp(-r t))", fit:"MAP, log-normal prior, re-fitted every "+GT.BIN_H+" h on bin medians",
      prior_source:LPA?LPA.meta.source:"built-in", prior:GT.prior(), posterior:GT.params(), sigma_y:CFG.sigmaY, skill_2h:GT.skill()},
    decision:{threshold:CFG.thr, od_min:CFG.odMin, lead_time_h:leadH(), light_mode:CFG.lightMode},
    weather:{source:WX.src, provider:"Open-Meteo", lat:CFG.lat, lon:CFG.lon, fetched:WX.fetched?iso(WX.fetched):null}
  }, null, 1), "application/json");

/* ================================================================
   12. PLOTTING · a minimal SVG line plot
   ================================================================ */
/* chart colours come from the CSS tokens, so the palette lives in one place */
function tok(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
var C = {od:tok("--color-data"), fit:tok("--color-model"), prior:tok("--color-ink-3"), risk:tok("--color-alarm"), green:tok("--color-signal-ink"),
         ink:tok("--color-ink"), paper:tok("--color-panel"), heat:tok("--color-heat"), vpd:tok("--color-warn"), dry:tok("--color-data-2"), salt:tok("--color-model"),
         data2:tok("--color-data-2"), warn:tok("--color-warn"), pipe:tok("--color-pipe"), signal:tok("--color-signal")};
function niceTicks(a,b,n){
  var raw=(b-a)/n, mag=Math.pow(10,Math.floor(Math.log10(raw||1))), st=mag;
  [1,2,5,10].some(function(m){ st=m*mag; return raw<=st; });
  var t=[]; for(var v=Math.ceil(a/st)*st; v<=b+st*1e-6; v+=st) t.push(+v.toFixed(6)); return t;
}
function plot(o){
  var W=o.w||720, H=o.h||240, l=44, r=12, tp=10, bt=26;
  var sx=function(v){ return l+(v-o.x0)/((o.x1-o.x0)||1)*(W-l-r); };
  var sy=function(v){ v=clamp(v,o.y0,o.y1); return H-bt-(v-o.y0)/((o.y1-o.y0)||1)*(H-tp-bt); };
  var out=['<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.title||"")+'">'];
  niceTicks(o.y0,o.y1,4).forEach(function(v){
    out.push('<line class="grid" x1="'+l+'" x2="'+(W-r)+'" y1="'+sy(v)+'" y2="'+sy(v)+'"/>');
    out.push('<text x="'+(l-5)+'" y="'+(sy(v)+4)+'" text-anchor="end">'+(o.yfmt?o.yfmt(v):v)+'</text>');
  });
  niceTicks(o.x0,o.x1,6).forEach(function(v){
    out.push('<text x="'+sx(v)+'" y="'+(H-8)+'" text-anchor="middle">'+(o.xfmt?o.xfmt(v):v)+'</text>');
  });
  out.push('<line class="ax" x1="'+l+'" x2="'+(W-r)+'" y1="'+(H-bt)+'" y2="'+(H-bt)+'"/>');
  (o.areas||[]).forEach(function(a){
    if(a.x.length<2) return;
    var up=a.x.map(function(x,i){ return sx(x).toFixed(1)+","+sy(a.hi[i]).toFixed(1); });
    var dn=a.x.map(function(x,i){ return sx(x).toFixed(1)+","+sy(a.lo[i]).toFixed(1); }).reverse();
    out.push('<polygon points="'+up.concat(dn).join(" ")+'" fill="'+a.c+'" opacity="'+(a.op||0.18)+'"/>');
  });
  (o.rules||[]).forEach(function(q){
    var v=q.x!=null, x=v?sx(q.x):null, y=v?null:sy(q.y);
    if(v && (q.x<o.x0||q.x>o.x1)) return;
    out.push(v ? '<line x1="'+x+'" x2="'+x+'" y1="'+tp+'" y2="'+(H-bt)+'" stroke="'+q.c+'" stroke-dasharray="3 3"/>'
               : '<line x1="'+l+'" x2="'+(W-r)+'" y1="'+y+'" y2="'+y+'" stroke="'+q.c+'" stroke-dasharray="5 4"/>');
    if(q.t) out.push('<text class="lbl" style="fill:'+q.c+'" x="'+(v?x+4:W-r-4)+'" y="'+(v?tp+11:y-4)+'"'+(v?'':' text-anchor="end"')+'>'+esc(q.t)+'</text>');
  });
  (o.lines||[]).forEach(function(s){
    var p=s.p.filter(function(q){ return q[0]>=o.x0 && q[0]<=o.x1 && isFinite(q[1]); });
    if(p.length<2) return;
    out.push('<polyline fill="none" stroke="'+s.c+'" stroke-width="'+(s.w||2)+'"'+(s.dash?' stroke-dasharray="'+s.dash+'"':'')+(s.op?' opacity="'+s.op+'"':'')+
      ' points="'+p.map(function(q){ return sx(q[0]).toFixed(1)+","+sy(q[1]).toFixed(1); }).join(" ")+'"/>');
  });
  (o.points||[]).forEach(function(s){
    s.p.forEach(function(q){ if(q[0]<o.x0||q[0]>o.x1) return;

  });
  if(o.ylab) out.push('<text class="lbl" x="'+(l+4)+'" y="'+(tp+11)+'">'+esc(o.ylab)+'</text>');

  return out.join("");
}
function key(items){

function sparkline(a,c){

  var ys=a.map(function(p){return p[1];}), lo=Math.min.apply(null,ys), hi=Math.max.apply(null,ys);

  var x0=a[0][0], x1=a[a.length-1][0];
  return '<svg class="spark" viewBox="0 0 100 28" preserveAspectRatio="none"><polyline fill="none" stroke="'+c+'" stroke-width="1.4" vector-effect="non-scaling-stroke" points="'+
    a.map(function(p){ return ((p[0]-x0)/((x1-x0)||1)*100).toFixed(1)+","+(26-(p[1]-lo)/(hi-lo)*24).toFixed(1); }).join(" ")+'"/></svg>';
}

function level(k){
  var c=CH[k], v=S.pv[k];
  if(v==null || !isFinite(v) || (S.mode==="live" && !fresh(k))) return "off";
  if((c.hi!=null && v>c.hi) || (k==="ph" && v<c.lo)) return "bad";
  if((c.whi!=null && v>c.whi) || (c.wlo!=null && v<c.wlo) || (k==="flow" && v<c.lo && S.act.valve==="OPEN")) return "warn";
  return "ok";
}
var WORD = {ok:["Good","良好"], warn:["Check","注意"], bad:["Problem","異常"], off:["No reading","無讀值"]};

/* ================================================================
   14. GROWTH TWIN · what a bioprocess engineer checks first
     1 is the link two-way, and live?        (twin vs shadow)
     2 is a process model running alongside? (the virtual asset)

function twinStatus(){
  var live=S.mode==="live" && liveIn(), sk=GT.skill(), ok=sk && sk.nrmse!=null && sk.nrmse<0.15 && sk.inBand>=0.6;
  var items=[
    [L("Data in","數據輸入"), live?badge("ok",L("live","即時")):badge(S.mode==="demo"?"off":"bad",S.mode==="demo"?L("demo","示範"):L("stopped","中斷")),
      live?S.link.inN+L(" readings"," 筆讀值"):L("simulated plant","模擬製程")],
    [L("Action out","動作輸出"), CFG.lightMode==="AUTO"?badge("ok",L("automatic","自動")):badge("warn",CFG.lightMode==="SUGGEST"?L("person confirms","人工確認"):L("manual","手動")),
      L("green light, filter valve","綠光、濾膜閥")],
    [L("Process model","製程模型"), GT.q?badge("ok",L("running","運行中")):badge("off",L("waiting","等待中")),
      GT.fits+L(" re-fits · every 6 min"," 次重擬 · 每 6 分鐘")],
    [L("Forecast accuracy","預測準確度"), sk&&sk.nrmse!=null?(ok?badge("ok",L("passes","通過")):badge("bad",L("fails","未通過"))):badge("off",L("too early","太早")),
      sk&&sk.nrmse!=null?"NRMSE "+fmt(sk.nrmse*100,1)+"% · "+Math.round(sk.inBand*100)+L("% in band","% 在區間內"):L("first score after 2 h","2 小時後開始評分")]
  ];
  var verdict = S.mode==="demo" ? L("Demo: the plant is simulated, so nothing here is evidence. Connect the board to run the twin on the real reactor.","示範：製程為模擬，此處不構成證據。連上板子才是在真實反應器上運行孿生。")
    : (live && CFG.lightMode==="AUTO" && ok) ? L("Digital twin: data flow both ways automatically, and the model that drives the action passes its accuracy test on this run.","數位孿生：數據雙向自動流動，驅動動作的模型在本次運行通過準確度測試。")
    : live ? L("Digital shadow with decision support: data and model are live, but a person still confirms the action (or the model has not yet passed).","具決策支援的數位影子：數據與模型即時運行，但動作仍由人確認（或模型尚未通過）。")
    : L("Link down: no data from the reactor.","連線中斷：沒有反應器數據。");
  return '<div class="card"><div class="card-bd"><div class="tests">'+items.map(function(i){
      return '<div class="test"><div class="h"><span>'+i[0]+'</span>'+i[1]+'</div><div class="e">'+esc(i[2])+'</div></div>'; }).join("")+'</div>'+
    '<div class="verdict" style="margin-top:10px">'+esc(verdict)+'</div></div></div>';
}

    areas: band?[{x:xs,lo:band.lo,hi:band.hi,c:C.fit}]:[],

           {p:S.hist.od||[],c:C.od,w:1,op:0.3},

    names.map(function(n,i){ var zz=z?z[i]:null; return '<tr><td><b>'+n[0]+'</b> <span class="muted">'+n[1]+'</span></td><td class="n">'+fmt(Math.exp(pr.mu[i]),3)+'</td><td class="n">'+(P?fmt(P[n[0]],3):"—")+'</td><td class="n">'+(zz==null?"—":(zz>0?"+":"")+fmt(zz,1)+"σ "+(Math.abs(zz)>2?badge("warn","!"):""))+'</td></tr>'; }).join("")+
    '</table></div><div class="card-bd"><p class="small">'+L("Model: logistic growth, X(t) = K / (1 + ((K−X0)/X0)·e^(−rt)). Every 6 min the OD samples are reduced to a median (bubbles rejected: ","模型：邏輯斯生長 X(t) = K / (1 + ((K−X0)/X0)·e^(−rt))。每 6 分鐘取 OD 中位數（已濾除氣泡：")+S.bubbles+
    L("), the point is scored against the forecast made 2 h earlier, then the three parameters are re-fitted by MAP: least squares plus a pull toward the calibration prior. Acceptance: 2 h forecast NRMSE < 15 % (Sinner et al. 2021).",

    (pts.length ? plot({w:820,h:240,x0:0,x1:72,y0:0,y1:1,title:"risk",xfmt:function(v){return "+"+v+"h";},yfmt:function(v){return Math.round(v*100)+"%";},
      lines:[{p:drv("heat"),c:C.heat,w:1.2,op:.7},{p:drv("vpd"),c:C.vpd,w:1.2,op:.7},{p:drv("dry"),c:C.dry,w:1.2,op:.7},{p:drv("salt"),c:C.salt,w:1.2,op:.7},{p:pts,c:C.risk,w:2.6}],
      rules:rules}) + key([{c:C.risk,t:L("overall risk","整體風險")},{c:C.heat,t:N(DRV.heat)},{c:C.vpd,t:N(DRV.vpd)},{c:C.dry,t:N(DRV.dry)},{c:C.salt,t:N(DRV.salt)}])

  /* pumps, set by hand */
  function pump(x,y,tag,name){ return '<g><circle cx="'+x+'" cy="'+y+'" r="20" class="m-eq"/><path d="M'+(x-9)+' '+(y+10)+' L'+x+' '+(y-12)+' L'+(x+9)+' '+(y+10)+'" class="m-pumpsym"/>'+
    '<text x="'+x+'" y="'+(y+38)+'" text-anchor="middle" class="m-name">'+tag+'</text><text x="'+x+'" y="'+(y+52)+'" text-anchor="middle" class="m-sub">'+name+' · '+L("hand-set","手動")+'</text></g>'; }
  s+=pump(720,520,"P-01",L("Loop pump","迴路幫浦"))+pump(275,450,"P-02",L("Shell pump","殼側幫浦"));
  /* pinch valve, the one automated valve */
  s+='<g class="m-hot" data-map="valve" tabindex="0" role="button" aria-label="'+esc(L("Filter valve","濾膜閥"))+'">'+
     '<rect x="420" y="470" width="100" height="60" fill="transparent"/>'+
     '<path d="M452 488 L488 512 L488 488 L452 512 Z" class="m-valve" id="m-valve"/>'+
     '<text x="500" y="486" class="m-name">XV-01 '+L("pinch valve","夾管閥")+'</text><text x="500" y="502" class="m-ctl" id="mv-valve">—</text></g>';
  /* instruments */
  s+=inst("flow",790,115,"FT-01",790,70)+inst("ph",680,115,"AT-02",680,70)+inst("pt1",570,115,"PT-01",570,70)+
     inst("pt3",400,420,"PT-03",470,420,"l")+inst("od",640,460,"AT-01",640,520,"r")+
     inst("pt4",340,115,"PT-04",340,165,"r")+inst("pt5",372,500,"PT-05",372,450);
  s+='</svg>';
  return s;
}
function renderMap(){
  var host=$("#v-map");
  if(MAP.lang!==LANG || !$("#map-svg")){
    MAP.lang=LANG;
    host.innerHTML='<div class="card"><div class="card-hd" style="padding-bottom:8px"><h2>'+L("System map","系統圖")+'</h2>'+
      '<div class="map-ctl"><span class="small">'+L("Green light","綠光")+'</span><button class="sw" id="mc-light" data-light aria-label="green light"></button><span id="mc-mode"></span>'+
      '<span class="small" style="margin-left:10px">'+L("Filter valve","濾膜閥")+'</span><button class="sw valve" id="mc-valve" data-valve aria-label="valve"></button></div></div>'+
      '<div class="map-box">'+buildMap()+'</div>'+
      '<div class="legend" style="padding:4px 16px 12px"><span><i style="background:'+C.pipe+'"></i>'+L("line, idle","管路，靜止")+'</span><span><i style="background:'+C.od+'"></i>'+L("liquid moving","液體流動")+'</span>'+
      '<span><i style="background:'+C.signal+'"></i>'+L("green light on","綠光開啟")+'</span><span><i style="background:transparent;border:1.5px dashed '+C.od+';height:9px"></i>'+L("tap to switch","點擊切換")+'</span>'+
      '<span class="muted">'+L("Pumps are set by hand; the page switches only the valve and the light.","幫浦手動設定；網頁只控制閥與燈。")+'</span></div></div>';
  }
  var p=S.pv, open=S.act.valve==="OPEN", green=S.act.light==="GREEN", moving=p.flow>20;
  ["od","ph","flow","pt1","pt3","pt4","pt5"].forEach(function(k){
    var n=$("#mv-"+k); if(n) n.textContent=fmt(p[k],CH[k].dec)+" "+CH[k].unit;
    var g=$("#mi-"+k); if(g) g.setAttribute("class","m-inst "+({warn:"m-warn",bad:"m-bad"}[level(k)]||""));
  });
  $("#mv-tmp").textContent="TMP "+fmt(p.tmp,3)+" bar · "+L("fouling ","堵塞 ")+fmt(p.foul,2)+"×";
  function flow(id,on){ var e=$("#mp-"+id); if(e) e.setAttribute("class","m-flow"+(on?" on":"")); }
  flow("feed",moving); flow("ret1",moving&&open); flow("ret2",moving&&open); flow("shTop",moving); flow("shBot",moving);
  $("#m-perm").setAttribute("opacity", moving && (p.tmp>0.03 || !open) ? "1" : "0");
  $("#m-valve").setAttribute("class","m-valve"+(open?" open":" shut"));
  $("#mv-valve").textContent = open ? L("open · tap to shut","開 · 點擊關閉") : L("shut · tap to open","關 · 點擊開啟");
  $("#m-glow").setAttribute("class","m-glow"+(green?" on":""));
  $("#m-led1").setAttribute("class","m-led"+(green?" on":"")); $("#m-led2").setAttribute("class","m-led"+(green?" on":""));
  /* broth tints toward the culture colour as OD rises */
  var od=clamp(p.od||0,0,1.5); $("#m-liquid").style.fill = "color-mix(in oklch, var(--color-panel-2), var(--color-signal-ink) "+Math.round(od/1.5*45)+"%)";
  $("#mv-light").textContent = "L-01 · "+(green?L("green ON · tap to switch off","綠光開 · 點擊關閉"):L("off · tap to switch on","關 · 點擊開啟"));
  $("#mc-light").className="sw"+(green?" on":""); $("#mc-valve").className="sw valve"+(open?" on":"");
  var mm={MANUAL:L("manual","手動"),SUGGEST:L("suggest","建議"),AUTO:L("auto","自動")}[CFG.lightMode];
  $("#mc-mode").innerHTML='<span class="st '+(CFG.lightMode==="AUTO"?"st-info":"st-off")+'">'+mm+'</span>';
}

/* ================================================================
   17. TOP BAR, RENDER, MAIN LOOP, EVENTS
   ================================================================ */
function renderTop(){
  $("#t-run").textContent=durH(hNow());
  $("#t-clock").textContent=hm(nowT())+(S.mode==="demo"?"*":"");
  var st=$("#status"), un=S.alarms.filter(function(a){return !S.acked[a.id];}), w=S.alarms[0];
  st.className="status"+(w?(w.pri===1?" alarm":" warn"):"");
  $("#st-h").textContent = w ? (w.pri===1?L("Needs attention","需要處理"):L("Check","注意")) : L("All normal","一切正常");
  $("#st-s").textContent = w ? w.t : (S.mode==="demo"?L("Demo data. No reactor connected","示範數據，未連接反應器"):L("All readings inside their limits","讀值皆在範圍內"));
  var b=$("#link-btn"); b.className="chip "+(S.mode==="live"&&liveIn()?"live":"demo");
  $("#link-txt").textContent = S.mode==="live" ? (liveIn()?L("Reactor live","反應器即時"):L("No data","無數據")) : L("Demo data","示範數據");
  var nb=$("#nav-badge"); nb.hidden=!un.length; nb.textContent=un.length;
}
var RENDER={today:renderToday, map:renderMap, twin:renderTwin, weather:renderWeather, data:renderData, setup:renderSetup};
function renderAll(){
  renderTop();
  var v=$("#v-"+S.view), a=document.activeElement;
  if(v && a && v.contains(a) && /INPUT|SELECT/.test(a.tagName)) return;   /* don't wipe a field being typed in */
  RENDER[S.view]();
}
function showView(v){
  S.view=v;
  [].forEach.call(document.querySelectorAll("#nav [data-view]"), function(b){ b.classList.toggle("on", b.dataset.view===v); });
  Object.keys(RENDER).forEach(function(k){ $("#v-"+k).hidden = k!==v; });
  renderAll(); window.scrollTo(0,0);
}
var lastBeat=0, lastWx=0;
function tick(){
  if(S.mode==="demo"){
    var dtH=CFG.speed/3600, n=Math.max(1,Math.min(60,Math.round(CFG.speed/60)));
    for(var i=0;i<n;i++) demoStep(dtH/n);
  }
  derive(); interlocks(); recordHist(); evalAlarms();
  LAST_D=decide(); autoAct(LAST_D); logRow();
  if(S.link.on && Date.now()-lastBeat>2000){ lastBeat=Date.now(); sendToBoard(); }
  if(Date.now()-lastWx>30*60*1000){ lastWx=Date.now(); wxFetch(); }
  renderAll();
}

document.addEventListener("click", function(e){
  var t=e.target.closest("button,[data-go],[data-map]"); if(!t) return;
  var d=t.dataset;
  if(d.map==="light") setLight(S.act.light==="GREEN"?"OFF":"GREEN","operator",L("switched on the system map","於系統圖切換"));
  else if(d.map==="valve") setValve(S.act.valve==="OPEN"?"CLOSED":"OPEN","operator",L("switched on the system map","於系統圖切換"));
  else if(d.view) showView(d.view);
  else if(d.go) showView(d.go==="trends"?"twin":d.go);
  else if(d.lang){ LANG=d.lang; lsSet("releaf.lang",LANG); applyStatic(); renderAll(); }
  else if(d.lmode){ CFG.lightMode=d.lmode; saveCfg(); audit("operator",L("Light mode → ","燈光模式 → ")+d.lmode,""); renderAll(); }
  else if(t.hasAttribute("data-light")) setLight(S.act.light==="GREEN"?"OFF":"GREEN","operator",L("switched by hand","手動切換"));
  else if(t.hasAttribute("data-valve")) setValve(S.act.valve==="OPEN"?"CLOSED":"OPEN","operator",L("switched by hand","手動切換"));
  else if(d.apply) setLight(d.apply,"operator",L("accepted the twin’s suggestion: ","採納孿生建議：")+(LAST_D?LAST_D.h:""));
  else if(d.ack){ S.acked[d.ack]=true; renderAll(); }
  else if(d.exp){ ({log:exportLog,audit:exportAudit,meta:exportMeta})[d.exp](); }
  else if(d.cal==="od"){
    /* With a board attached the conversion from counts to OD happens there, so
       zeroing means capturing the blank counts and pushing them down. In demo
       there are no counts, so the page holds the offset instead. */
    if(S.mode==="live" && LAST_OD_COUNTS!=null){
      CAL.odCounts=LAST_OD_COUNTS; CAL.odBlank=0; CAL.odWhen=Date.now(); saveCal(); sendCal();
      audit("operator",L("OD zeroed on the board","於板子將 OD 歸零"),"blank counts "+fmt(CAL.odCounts,1));
    } else if(LAST_RAW_OD!=null){
      CAL.odBlank=LAST_RAW_OD; CAL.odWhen=Date.now(); saveCal();
      audit("operator",L("OD zeroed","OD 歸零"),"blank "+fmt(CAL.odBlank,4));
    }
    renderAll(); }
  else if(d.cal==="ph"){ CAL.phWhen=Date.now(); saveCal(); sendCal(); audit("operator",L("pH calibration recorded","記錄 pH 校正"),""); renderAll(); }
  else if(d.cal==="foul"){ S.foulBase=null; S.foulBaseN=[]; DEMO.foul=1; audit("operator",L("Filter cleaned. Relearning its clean level","濾膜已清洗，重新建立基準"),""); renderAll(); }
  else if(t.hasAttribute("data-refit")){ GT.reset(); audit("operator",L("Growth model restarted","生長模型重啟"),""); renderAll(); }
  else if(t.hasAttribute("data-restart")){ startRun("demo"); renderAll(); }
  else if(t.hasAttribute("data-link")) toggleLink();
  else if(t.hasAttribute("data-wx")){ wxFetch(); }
  else if(t.id==="link-btn") showView("setup");
  else if(d.dwin){ S.dataWin = d.dwin==="all" ? "all" : +d.dwin; renderAll(); }
  else if(t.id==="stop") safeState();
});
document.addEventListener("keydown", function(e){
  if((e.key==="Enter"||e.key===" ") && e.target.dataset && e.target.dataset.map){ e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click",{bubbles:true})); }
});
document.addEventListener("change", function(e){
  var k=e.target.dataset && e.target.dataset.cfg; if(!k) return;
  var v=e.target.type==="text" ? e.target.value : parseFloat(e.target.value);
  if(e.target.type!=="text" && !isFinite(v)) return;
  CFG[k]=v; saveCfg();
  audit("operator",L("Setting ","設定 ")+k+" = "+v,"");
  if(k==="lat"||k==="lon"){ WX.src="none"; wxFetch(); }
  if(k==="odScale"||k==="transferSd"||k==="sigmaY") GT.fit();
  e.target.blur(); renderAll();
});

applyStatic();
startRun("demo");
wxSnapshot(); WX.src="none";
wxFetch(); lastWx=Date.now();
tick();
setInterval(tick, 1000);
})();
</script>
</body>
