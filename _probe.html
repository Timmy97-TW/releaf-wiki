<div id="out">pending</div>
<script>
var q=new URLSearchParams(location.search);
var f=document.createElement('iframe'); f.width=390; f.height=900; f.src='/'+(q.get('p')||'results')+'/';
document.body.appendChild(f);
f.onload=function(){setTimeout(function(){
  var d=f.contentDocument, w=d.querySelectorAll('.tablewrap')[+(q.get('i')||0)];
  var cs=f.contentWindow.getComputedStyle(w);
  document.getElementById('out').textContent=[cs.backgroundImage,cs.backgroundAttachment,cs.backgroundSize,cs.backgroundPosition].join('\n---\n');
},1200);};
</script>
