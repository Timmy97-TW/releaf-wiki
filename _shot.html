<style>html,body{margin:0;background:#fff}iframe{border:0;display:block}</style>
<div></div>
<script>
var q=new URLSearchParams(location.search);
var f=document.createElement('iframe');
f.width=q.get('w')||390; f.height=q.get('h')||3000;
f.src='/'+(q.get('p')||'results')+'/'+(q.get('hash')||'');

f.onload=function(){ try{ f.contentWindow.scrollTo(0, +(q.get('y')||0)); }catch(e){} };
</script>
