  <title id="fig-ladder-t">The truncation ladder is not monotonic: the four-rung comparison dips at 9 to 23</title>
  <desc id="fig-ladder-d">Clamp integrity and bidentate salt-bridge occupancy for the full-length peptide and the three cuts. Full length, 7 to 23 and 15 to 23 all hold the clamp above 98 per cent. Only the intermediate 9 to 23 construct, the one that was ordered, falls to 77.1 per cent clamp integrity and 46.9 per cent bidentate occupancy. Shorter is not the variable.</desc>
