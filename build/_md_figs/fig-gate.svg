<svg class="mdfig" viewBox="0 0 780 400" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" aria-labelledby="fig-gate-t fig-gate-d" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title id="fig-gate-t">The same tagged construct under the project's own acceptance gate and under an atom-resolved criterion</title>
  <desc id="fig-gate-d">Six measures of one pair of trajectories. Under the three distance-only measures above the dashed line the tagged construct is indistinguishable from wild type and has the lowest conserved-window RMSD in the whole set, 1.12 angstroms. Under the three atom-resolved measures below it, every one reads 0.0 per cent against 99.8 to 100 per cent for wild type.</desc>
<rect x="0" y="0" width="780" height="400" fill="none"/>
<text x="26.0" y="26.0" font-size="11.5" fill="#1d1d1f" text-anchor="start" font-weight="700" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">One pair of trajectories, two definitions of the same contact</text>
<text x="26.0" y="42.0" font-size="9.5" fill="#6e6e73" text-anchor="start" font-weight="400" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">bars are the measured value &#183; 1,500 frames each</text>
<rect x="568" y="18" width="14" height="10" rx="2" fill="#23684a"/>
<text x="588.0" y="27.0" font-size="11" fill="#23684a" text-anchor="start" font-weight="700" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">wild type</text>
<rect x="662" y="18" width="14" height="10" rx="2" fill="#9a3d22"/>
<text x="682.0" y="27.0" font-size="11" fill="#9a3d22" text-anchor="start" font-weight="700" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">+ 6&#215;His</text>
<text x="220.0" y="86.0" font-size="9.5" fill="#6e6e73" text-anchor="end" font-weight="700" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" letter-spacing="0.07em">BEFORE THE CONSTRUCT EXISTED</text>
<text x="236.0" y="86.0" font-size="9.5" fill="#6e6e73" text-anchor="start" font-weight="400" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">the gate as written: distances between atoms</text>
<text x="220.0" y="114.0" font-size="11" fill="#1d1d1f" text-anchor="end" font-weight="600" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Asn23-Arg487 within 4 &#8491;</text>
<text x="220.0" y="128.0" font-size="9.5" fill="#6e6e73" text-anchor="end" font-weight="400" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">either oxygen counts</text>
<rect x="236" y="104" width="360.0" height="10" rx="2" fill="#23684a" opacity="0.95"/>
<text x="603.0" y="112.5" font-size="10" fill="#23684a" text-anchor="start" font-weight="700" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">100.0%</text>
<rect x="236" y="118" width="359.3" height="10" rx="2" fill="#9a3d22" opacity="0.88"/>
<text x="602.3" y="126.5" font-size="10" fill="#9a3d22" text-anchor="start" font-weight="700" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">99.8%</text>
<text x="220.0" y="164.0" font-size="11" fill="#1d1d1f" text-anchor="end" font-weight="600" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Clamp, 3 of 4 contacts held</text>
<text x="220.0" y="178.0" font-size="9.5" fill="#6e6e73" text-anchor="end" font-weight="400" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">either oxygen counts</text>
<rect x="236" y="154" width="360.0" height="10" rx="2" fill="#23684a" opacity="0.95"/>
<text x="603.0" y="162.5" font-size="10" fill="#23684a" text-anchor="start" font-weight="700" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">100.0%</text>
<rect x="236" y="168" width="358.9" height="10" rx="2" fill="#9a3d22" opacity="0.88"/>
<text x="601.9" y="176.5" font-size="10" fill="#9a3d22" text-anchor="start" font-weight="700" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">99.7%</text>
<text x="220.0" y="214.0" font-size="11" fill="#1d1d1f" text-anchor="end" font-weight="600" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Conserved-window RMSD</text>
<text x="220.0" y="228.0" font-size="9.5" fill="#6e6e73" text-anchor="end" font-weight="400" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">lower is steadier</text>
<rect x="236" y="204" width="231.2" height="10" rx="2" fill="#23684a" opacity="0.95"/>
<text x="474.2" y="212.5" font-size="10" fill="#23684a" text-anchor="start" font-weight="700" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">1.67 &#8491;</text>
<rect x="236" y="218" width="155.1" height="10" rx="2" fill="#9a3d22" opacity="0.88"/>
<text x="398.1" y="226.5" font-size="10" fill="#9a3d22" text-anchor="start" font-weight="700" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">1.12 &#8491;</text>
<line x1="26" y1="232" x2="760" y2="232" stroke="#a3a3a3" stroke-dasharray="3 4"/>
<text x="220.0" y="254.0" font-size="9.5" fill="#9a3d22" text-anchor="end" font-weight="700" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" letter-spacing="0.07em">AFTER, ON NAMED ATOMS</text>
<text x="236.0" y="254.0" font-size="9.5" fill="#9a3d22" text-anchor="start" font-weight="400" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">the same trajectory, measured on the chemistry</text>
<text x="220.0" y="282.0" font-size="11" fill="#1d1d1f" text-anchor="end" font-weight="600" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Bidentate salt bridge</text>
<text x="220.0" y="296.0" font-size="9.5" fill="#6e6e73" text-anchor="end" font-weight="400" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">both oxygens, angle-aware</text>
<rect x="236" y="272" width="360.0" height="10" rx="2" fill="#23684a" opacity="0.95"/>
<text x="603.0" y="280.5" font-size="10" fill="#23684a" text-anchor="start" font-weight="700" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">100.0%</text>
<rect x="236" y="286" width="1.6" height="10" rx="2" fill="#9a3d22" opacity="0.88"/>
<text x="243.0" y="294.5" font-size="10" fill="#9a3d22" text-anchor="start" font-weight="700" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">0.0%</text>
<text x="220.0" y="332.0" font-size="11" fill="#1d1d1f" text-anchor="end" font-weight="600" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Two or more H-bonds to Arg487</text>
<text x="220.0" y="346.0" font-size="9.5" fill="#6e6e73" text-anchor="end" font-weight="400" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">named donor and acceptor</text>
<rect x="236" y="322" width="359.3" height="10" rx="2" fill="#23684a" opacity="0.95"/>
<text x="602.3" y="330.5" font-size="10" fill="#23684a" text-anchor="start" font-weight="700" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">99.8%</text>
<rect x="236" y="336" width="1.6" height="10" rx="2" fill="#9a3d22" opacity="0.88"/>
<text x="243.0" y="344.5" font-size="10" fill="#9a3d22" text-anchor="start" font-weight="700" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">0.0%</text>
<text x="220.0" y="382.0" font-size="11" fill="#1d1d1f" text-anchor="end" font-weight="600" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Carboxylate in Arg487 shell</text>
<text x="220.0" y="396.0" font-size="9.5" fill="#6e6e73" text-anchor="end" font-weight="400" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">first solvation shell</text>
<rect x="236" y="372" width="360.0" height="10" rx="2" fill="#23684a" opacity="0.95"/>
<text x="603.0" y="380.5" font-size="10" fill="#23684a" text-anchor="start" font-weight="700" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">100.0%</text>
<rect x="236" y="386" width="1.6" height="10" rx="2" fill="#9a3d22" opacity="0.88"/>
<text x="243.0" y="394.5" font-size="10" fill="#9a3d22" text-anchor="start" font-weight="700" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">0.0%</text>
</svg>
