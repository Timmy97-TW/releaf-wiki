<svg class="mdfig" viewBox="0 0 700 300" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" aria-labelledby="fig-apo-t fig-apo-d" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title id="fig-apo-t">Receptor alpha-carbon RMSD across all nine runs, with the apo run as the floor</title>
  <desc id="fig-apo-d">Nine rows. The receptor simulated with no peptide at all has the lowest RMSD of the set at 1.57 angstroms, one hundredth of an angstrom below the steadiest bound run. The bound runs spread over 0.59 angstroms among themselves. Changing the peptide moves the receptor more than removing it, so no receptor-side difference in this set is read as peptide-induced stabilisation.</desc>
<text x="20.0" y="26.0" font-size="11.5" fill="#1d1d1f" text-anchor="start" font-weight="700" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Receptor C&#945; RMSD, all nine runs</text>
<text x="20.0" y="42.0" font-size="9.5" fill="#6e6e73" text-anchor="start" font-weight="400" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">the receptor on its own is the steadiest trajectory in the set</text>
<text x="138.0" y="80.0" font-size="10" fill="#1d1d1f" text-anchor="end" font-weight="700" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">apo, no peptide</text>
