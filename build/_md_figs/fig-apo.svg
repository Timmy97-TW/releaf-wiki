<text x="20.0" y="269.0" font-size="10" fill="#6e6e73" text-anchor="start" font-weight="400" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">0.59 &#8491; separates the bound runs from each other; 0.01 &#8491; separates the apo run from the steadiest of them. Changing the</text>
