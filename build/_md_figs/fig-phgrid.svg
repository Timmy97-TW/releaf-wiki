<text x="410.0" y="240.0" font-size="24" fill="#9a3d22" text-anchor="start" font-weight="700" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">6.9</text>
<text x="410.0" y="254.0" font-size="9" fill="#6e6e73" text-anchor="start" font-weight="400" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">bidentate</text>
