<text x="608.0" y="276.0" font-size="9" fill="#6e6e73" text-anchor="end" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">RMSD 1.33 &#8491;</text>
<text x="20.0" y="318.0" font-size="10" fill="#6e6e73" text-anchor="start" font-weight="400" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Neither change alone pulls the C-terminus off the receptor: the His22 self-contact runs at 17.4% of frames from truncation</text>
<text x="20.0" y="333.0" font-size="10" fill="#6e6e73" text-anchor="start" font-weight="400" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">and 64.7% from protonation. Only the two together reach 96.9%, and that is the frame count on which the clamp collapses.</text>
