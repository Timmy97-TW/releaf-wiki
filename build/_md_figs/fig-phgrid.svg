<svg class="mdfig" viewBox="0 0 700 354" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" aria-labelledby="fig-phgrid-t fig-phgrid-d" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title id="fig-phgrid-t">Truncation crossed with protonation: only the combination fails</title>
  <desc id="fig-phgrid-d">A two-by-two. Full length at pH 7 is the reference. Protonating three histidines on the full-length peptide recovers the Glu12 to His227 contact from 0.8 to 99.9 per cent of frames and leaves the bidentate salt bridge at 99.9 per cent. The same protonation applied to the 9 to 23 construct drops bidentate occupancy from 46.9 to 6.9 per cent, the only run in the set to fail its acceptance criteria, and its backbone RMSD improves while it fails.</desc>
<text x="150.0" y="28.0" font-size="11.5" fill="#1d1d1f" text-anchor="start" font-weight="700" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">The same two changes, crossed</text>
<text x="150.0" y="44.0" font-size="9.5" fill="#6e6e73" text-anchor="start" font-weight="400" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">bidentate salt bridge (left) and Glu12-His227 (right), % of frames</text>
<text x="265.0" y="66.0" font-size="11" fill="#6e6e73" text-anchor="middle" font-weight="700" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">pH 7</text>
<text x="509.0" y="66.0" font-size="11" fill="#6e6e73" text-anchor="middle" font-weight="700" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">pH 5.5, three histidines protonated</text>
<text x="136.0" y="124.0" font-size="11" fill="#6e6e73" text-anchor="end" font-weight="700" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">full length</text>
<text x="136.0" y="139.0" font-size="10" fill="#6e6e73" text-anchor="end" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">1-23</text>
<text x="136.0" y="234.0" font-size="11" fill="#6e6e73" text-anchor="end" font-weight="700" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">truncated</text>
<text x="136.0" y="249.0" font-size="10" fill="#6e6e73" text-anchor="end" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">9-23</text>
