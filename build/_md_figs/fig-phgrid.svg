<text x="364.0" y="98.0" font-size="9.5" fill="#23684a" text-anchor="end" font-weight="700" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">reference</text>
<text x="364.0" y="166.0" font-size="9" fill="#6e6e73" text-anchor="end" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">RMSD 1.67 &#8491;</text>
