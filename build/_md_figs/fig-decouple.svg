<svg class="mdfig" viewBox="0 0 760 440" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" aria-labelledby="fig-decouple-t fig-decouple-d" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title id="fig-decouple-t">Conserved-window backbone RMSD against bidentate salt-bridge occupancy, eight runs</title>
  <desc id="fig-decouple-d">A scatter of the eight peptide-bearing runs. The horizontal axis is backbone RMSD over the conserved window, the vertical axis is the share of frames holding the bidentate Arg487 salt bridge. The points do not line up: the tagged construct at 1.12 angstroms and the failed 9 to 23 run at pH 5.5 at 1.33 angstroms are the two lowest RMSDs in the set and hold the salt bridge in 2.4 and 6.9 per cent of frames, while the 15 to 23 control at 1.81 angstroms holds it in 97.2 per cent.</desc>
<text x="26.0" y="26.0" font-size="11.5" fill="#1d1d1f" text-anchor="start" font-weight="700" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Backbone RMSD does not predict whether the salt bridge survives</text>
<text x="26.0" y="42.0" font-size="9.5" fill="#6e6e73" text-anchor="start" font-weight="400" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">eight peptide-bearing runs &#183; Pearson +0.13, Spearman +0.29</text>
<text x="724.0" y="42.0" font-size="9.5" fill="#6e6e73" text-anchor="end" font-weight="400" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">vertical: bidentate Arg487 salt bridge, % of 1,500 frames</text>
