<text x="495.0" y="94.0" font-size="10" fill="#1d1d1f" text-anchor="middle" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">15-23</text>
<text x="495.0" y="106.0" font-size="9" fill="#23684a" text-anchor="middle" font-weight="700" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">control that held</text>
