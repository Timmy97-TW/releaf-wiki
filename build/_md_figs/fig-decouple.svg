<text x="234.7" y="165.1" font-size="10" fill="#1d1d1f" text-anchor="middle" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">7-23</text>
<circle cx="666.4" cy="219.8" r="5.5" fill="#92610c" opacity="0.92"/>
<text x="654.4" y="223.8" font-size="10" fill="#1d1d1f" text-anchor="end" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">9-23</text>
<text x="654.4" y="235.8" font-size="9" fill="#92610c" text-anchor="end" font-weight="700" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">ordered construct</text>
<circle cx="210.7" cy="295.0" r="5.5" fill="#9a3d22" opacity="0.92"/>
<text x="222.7" y="313.0" font-size="10" fill="#1d1d1f" text-anchor="start" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">9-23 pH 5.5</text>
<text x="222.7" y="325.0" font-size="9" fill="#9a3d22" text-anchor="start" font-weight="700" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">failed the gate</text>
<circle cx="110.0" cy="303.5" r="5.5" fill="#9a3d22" opacity="0.92"/>
<text x="122.0" y="287.5" font-size="10" fill="#1d1d1f" text-anchor="start" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">1-23 + 6xHis</text>
<text x="122.0" y="299.5" font-size="9" fill="#9a3d22" text-anchor="start" font-weight="700" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">tag</text>
<text x="26.0" y="370.0" font-size="10.5" fill="#1d1d1f" text-anchor="start" font-weight="400" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">The two steadiest runs in the set, by the number a construct would normally be ranked on, are the tagged construct and the only</text>
<text x="26.0" y="385.0" font-size="10.5" fill="#1d1d1f" text-anchor="start" font-weight="400" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">run that failed its gate. Contact count does better, Spearman +0.71 over the seven untagged runs, but on seven points. Named atom</text>
<text x="26.0" y="400.0" font-size="10.5" fill="#1d1d1f" text-anchor="start" font-weight="400" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">pairs do better than either.</text>
