<text x="54.0" y="312.0" font-size="9.5" fill="#6e6e73" text-anchor="end" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">0</text>
<line x1="62" y1="261.0" x2="724.0" y2="261.0" stroke="#e5e5e5"/>
