<line x1="62" y1="214.0" x2="724.0" y2="214.0" stroke="#e5e5e5"/>
<text x="54.0" y="218.0" font-size="9.5" fill="#6e6e73" text-anchor="end" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">50</text>
<line x1="62" y1="167.0" x2="724.0" y2="167.0" stroke="#e5e5e5"/>
<text x="54.0" y="171.0" font-size="9.5" fill="#6e6e73" text-anchor="end" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">75</text>
<line x1="62" y1="120.0" x2="724.0" y2="120.0" stroke="#e5e5e5"/>
<text x="54.0" y="124.0" font-size="9.5" fill="#6e6e73" text-anchor="end" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">100</text>
<line x1="62" y1="195.2" x2="724.0" y2="195.2" stroke="#a3a3a3" stroke-dasharray="3 4"/>
<text x="148.3" y="325.0" font-size="9.5" fill="#6e6e73" text-anchor="middle" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">1.2</text>
<text x="340.2" y="325.0" font-size="9.5" fill="#6e6e73" text-anchor="middle" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">1.6</text>
<text x="532.1" y="325.0" font-size="9.5" fill="#6e6e73" text-anchor="middle" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">2.0</text>
<text x="724.0" y="325.0" font-size="9.5" fill="#6e6e73" text-anchor="middle" font-weight="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">2.4</text>
<text x="393.0" y="342.0" font-size="10" fill="#6e6e73" text-anchor="middle" font-weight="400" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">conserved-window backbone RMSD (&#8491;)  &#8212;  steadier to the left</text>
<line x1="134.0" y1="113.2" x2="134.0" y2="78.0" stroke="#3f5468" stroke-width="0.8" opacity="0.4"/>
