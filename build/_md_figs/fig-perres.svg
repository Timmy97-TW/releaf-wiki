<svg class="mdfig" viewBox="0 0 760 352" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" aria-labelledby="fig-perres-t fig-perres-d" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title id="fig-perres-t">Per-residue contact occupancy and fluctuation for the wild-type reference run</title>
  <desc id="fig-perres-d">Twenty-three bars, one per residue. The opening GILIGS segment is low-occupancy and the fluctuation line sits above two angstroms across it. From Ser15 to Asn23 occupancy is near 100 per cent and fluctuation is sub-angstrom. The two ends of the peptide behave differently, and the conserved end is the one in contact.</desc>
<text x="40.0" y="24.0" font-size="11.5" fill="#1d1d1f" text-anchor="start" font-weight="700" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Contact occupancy (bars) and fluctuation (line), full-length BoPEP4</text>
<text x="40.0" y="40.0" font-size="9.5" fill="#6e6e73" text-anchor="start" font-weight="400" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">occupancy = share of 1,500 frames within 4 &#8491; of the receptor</text>
