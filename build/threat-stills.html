<!doctype html>
<!-- build/threat-stills.html: the 01 map's resting stills
     (assets/img/home/threat-map-1..7.webp). One stop of the map, drawn by
     assets/js/home-threat.js, the place in the middle. It reads the stops
     from the homepage, so a still always matches the live view. With the site
     root served on :8794, open
       http://localhost:8794/build/threat-stills.html?stop=3          (1-7)
     at 1200 x 900 and screenshot it once window.__stillReady resolves, e.g.
       node shot-slow.mjs "http://localhost:8794/build/threat-stills.html?stop=3" out --w 1200 --h 900 --js "window.__stillReady"
       cwebp -q 84 -m 6 -sharp_yuv out-1.png -o assets/img/home/threat-map-3.webp
     The island is 92% of the frame tall at zoom 1, as on the live map. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>01 map still</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/home-threat.css" />
  <style>
    html, body { margin: 0; height: 100%; background: #ffffff; overflow: hidden; }
    .tm { position: fixed; inset: 0; }
    .tm .tm-map { display: block; position: absolute; inset: 0; background: #ffffff; }
  </style>
</head>
<body>
  <div class="tm" id="tm"><div class="tm-map" id="m"></div></div>
  <script>window.__tmNoDriver = true;</script>
  <script src="assets/data/threat-counties.js"></script>
  <script src="assets/js/home-threat.js"></script>
  <script>
    window.__stillReady = (async function () {
      var PAGE = "index.html", MASK = "assets/img/home/threat-farmland-hi.webp";
      var q = new URLSearchParams(location.search);
      var k = Math.max(1, Math.min(8, +(q.get("stop") || 1))) - 1;
      var doc = new DOMParser().parseFromString(await (await fetch(PAGE)).text(), "text/html");
      var st = doc.querySelectorAll("#threat .tm-stop")[k];
      var layer = Math.max(0, window.__tmLayers.indexOf(st.getAttribute("data-layer")));
      var focus = st.getAttribute("data-focus") || "";
      var mk = (st.getAttribute("data-mark") || "").split(",").map(Number);
      var host = document.getElementById("m");
      var map = window.__tmMap(host, { keep: true, allowSoft: true, mask: MASK, foci: focus ? [focus] : [],
                                       pal: window.__tmPalette(document.getElementById("tm")) });
      if (!map) return "no renderer";
      map.size(host.clientWidth, host.clientHeight, 1);
      // the frame centres on the focused place where there is one (the live
      // view leaves room for the words on the left; a still does not)
      var vx = +st.getAttribute("data-x"), vy = +st.getAttribute("data-y");
      if (focus) {
        var names = focus.split(","), x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
        map.counties.forEach(function (c) {
          if (names.indexOf(c.name) < 0) return;
          c.d.replace(/([-\d.]+),([-\d.]+)/g, function (m, x, y) { x = +x; y = +y;
            x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); return m; });
        });
        vx = (x0 + x1) / 2 / 840; vy = (y0 + y1) / 2 / 1267;
      }
      var view = { x: vx, y: vy, z: +st.getAttribute("data-z"),
                   fx: .5, fy: .5, la: layer, lb: layer, t: 0, wash: layer === 0 ? 1 : 0,
                   fw: [focus ? 1 : 0, 0, 0, 0], fp: mk.length === 2 && !isNaN(mk[0]) ? [mk[0], mk[1], 1] : [0, 0, 0],
                   txt: 0, still: true };
      map.draw(view);
      if (!(await map.ready)) return "no mask";
      await new Promise(function (r) { setTimeout(r, 400); });
      map.draw(view);
      await new Promise(function (r) { requestAnimationFrame(function () { requestAnimationFrame(r); }); });
      return "ok " + (k + 1);
    })();
  </script>
</body>
</html>
