<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" role="img" aria-labelledby="lpab-s-t"><title id="lpab-s-t">The solder side of the LPA's 160 by 100 mm perf board, seen from below. Solder sits on the nine MOSFET legs and on five three-hole joints: one on each side for that tier's eight LED minus leads and its MOSFET's drain, one for all 24 plus leads and 5 V, one for the three sources and GND.</title><style>
text { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; font-size: 17px; fill: #1f2933; }
.m { text-anchor: middle; } .e { text-anchor: end; }
.brd { fill: #e9f2ec; stroke: #86b39a; stroke-width: 1; }
.holes { fill: #fff; stroke: #c6ced5; stroke-width: 1.5; }
.mh { fill: #fff; stroke: #c3cbd2; stroke-width: 2.4; }
text.silk { font-family: Menlo, monospace; font-size: 11px; fill: #3d7a5a; }
.hs { fill: #f6f2e8; stroke: #b9ae94; stroke-width: 1; } .stub { fill: none; stroke: #a3adb6; stroke-width: 3.4; }
text.pn { font-family: Menlo, monospace; font-size: 17px; font-weight: 700; fill: #3f4954; }
text.gl { font-weight: 650; font-size: 19px; } text.note, text.cl { font-size: 15.5px; fill: #5b6670; }
.tq { fill: #2c3237; stroke: #13171a; stroke-width: 1; } .tab { fill: #c9ced3; stroke: #8f989f; stroke-width: 1; }
text.qt { fill: #fff; font-weight: 700; font-size: 12.5px; }
.pq, .tip { fill: #c2c9cf; stroke: #5d6770; stroke-width: .8; }
.wo, .wc { fill: none; stroke-linecap: round; stroke-linejoin: round; } .wo { stroke-width: 7.4; } .wc { stroke-width: 5.6; }
.wo.red { stroke: #8e2a22; } .wc.red { stroke: #d0402f; } .wo.black { stroke: #0c0f11; } .wc.black { stroke: #2b3136; }
.spd { fill: #d8dde2; stroke: #9aa5ae; stroke-width: 1.2; }
.sb { fill: none; stroke: #d8dde2; stroke-width: 10; stroke-linecap: round; }
.sbo { fill: none; stroke: #9aa5ae; stroke-width: 12.4; stroke-linecap: round; }
.sc { fill: none; stroke-width: 2.6; stroke-linecap: round; }
