text><text class="gl e" x="128" y="208" dy=".36em">High tier</text><text class="cl e" x="128" y="232" dy=".36em">8 LED &#8722; leads</text><text class="cl e" x="128" y="252" dy=".36em">4 green + 4 red</text><text class="gl m" x="460" y="55" dy=".36em">Medium tier</text><text class="cl m" x="460" y="77" dy=".36em">8 LED &#8722; leads (4 green + 4 red)</text><text class="gl m" x="460" y="525" dy=".36em">All 24 LED + leads</text><text class="cl m" x="460" y="547" dy=".36em">soldered together, to 5 V</text><text class="cl e" x="418.19" y="352.65" dy=".36em">sources, to GND</text><text class="note m" x="460" y="600" dy=".36em">Seen from below, so left and right swap.</text><text class="note m" x="460" y="621" dy=".36em">Traces: blue low tier, amber medium, violet high; red 5 V; black GND.</text></svg>