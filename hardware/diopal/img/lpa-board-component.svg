<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" role="img" aria-labelledby="lpab-c-t"><title id="lpab-c-t">The component side of the LPA's 160 by 100 mm perf board. Three IRLZ44N MOSFETs stand in a row in the centre: Q1 switches the low tier from Arduino pin D9, Q2 the medium tier from D10, Q3 the high tier from D11. Each drain is wired to a three-hole joint on its tier's side of the board, where that tier's eight LED minus leads are soldered: low on the left, medium on top, high on the right. All 24 plus leads meet in a joint on the bottom side, wired to 5 V, and the three sources meet in a joint wired to GND.</title><style>
