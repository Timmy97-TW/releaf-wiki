<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" role="img"><title>The adapter: a 15 k / 22 k divider on S, with 0.1 µF</title><style>
text { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; font-size: 13px; fill: #1f2933; }
.m { text-anchor: middle; } .e { text-anchor: end; }
.brd { fill: #e9f2ec; stroke: #86b39a; } .glue { fill: rgb(200 215 225 / .25); stroke: #b8c6cf; stroke-dasharray: 5 4; }
.holes { fill: #fff; stroke: #c6ced5; stroke-width: 3; }
text.silk { font-family: Menlo, monospace; font-size: 12px; fill: #3d7a5a; }
.hs { fill: #f6f2e8; stroke: #b9ae94; } .stub { stroke: #a3adb6; stroke-width: 4; fill: none; }
