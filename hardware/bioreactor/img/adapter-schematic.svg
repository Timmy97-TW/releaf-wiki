.rb.mf { fill: #cfe3f2; stroke: #6f97b8; } text.rv { font-size: 11.5px; fill: #23313d; }
.tip { fill: #c2c9cf; stroke: #5d6770; }
.disc { fill: #b8312a; stroke: #7d1d17; fill-opacity: .92; } .disc.see { fill-opacity: .45; } text.dv { fill: #fff; font-weight: 700; }
.wo, .wc { fill: none; stroke-linecap: round; stroke-linejoin: round; } .wo { stroke-width: 8; } .wc { stroke-width: 6; }
.wo.red { stroke: #8e2a22; } .wc.red { stroke: #d0402f; } .wo.black { stroke: #0c0f11; } .wc.black { stroke: #2b3136; }
.wo.yellow { stroke: #a68a00; } .wc.yellow { stroke: #f1d21a; }
.spd { fill: #d8dde2; stroke: #9aa5ae; stroke-width: 1.2; }
.sb { fill: none; stroke: #d8dde2; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; }
.w { fill: none; stroke-linecap: round; stroke-linejoin: round; } .sc { stroke-width: 3.4; }
.gnd { stroke: #161b20; } .out { stroke: #2f9e4f; } .ygnd { stroke: #d9b400; } .pwr5 { stroke: #9a3d22; } .sig { stroke: #2f7d55; }
.unk { fill: none; stroke: #9aa3aa; stroke-width: 2; stroke-dasharray: 5 4; }
.sym { fill: none; stroke: #2f3a44; stroke-width: 1.6; }
