<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReLeaf 3-Channel Package — Massing Model</title>
<meta name="description" content="Massing study for the three-channel packaged bioreactor: three cassettes in one enclosure, shared drive spine.">
<style>
  :root { --bg: #06070a; --fg: #f2f5f8; --dim: #656d7a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #gl { width: 100vw; height: 100vh; display: block; touch-action: none; cursor: grab; }
  #gl:active { cursor: grabbing; }
  .hint {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    font-size: .62rem; letter-spacing: .22em; text-transform: uppercase;
    color: var(--dim); z-index: 2; user-select: none;
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="hint">Massing study — drag to orbit</div>
<script src="../js/vendor/three.min.js"></script>
<script src="js/package.js"></script>
</body>
</html>
