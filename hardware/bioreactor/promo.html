<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReLeaf Bioreactor — Promo Assembly</title>
<meta name="description" content="The assembled ReLeaf bioreactor loop: media, pump, hollow-fiber membrane, in-line photometer, harvest vessel.">
<style>
  :root { --bg: #06070a; --fg: #f2f5f8; --dim: #656d7a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #gl { width: 100vw; height: 100vh; display: block; touch-action: none; cursor: grab; }
  #gl:active { cursor: grabbing; }
  .loader {
    position: fixed; inset: 0; display: grid; place-content: center;
    background: var(--bg); z-index: 5; transition: opacity .5s ease;
    font-size: .8rem; color: var(--dim); letter-spacing: .2em; text-transform: uppercase;
  }
  .loader.hide { opacity: 0; pointer-events: none; }
  .hint {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    font-size: .62rem; letter-spacing: .22em; text-transform: uppercase;
    color: var(--dim); z-index: 2; user-select: none;
  }
</style>
</head>
<body>
<div class="loader" id="loader">Loading <span id="load-pct">0%</span></div>
<canvas id="gl"></canvas>
<div class="hint">Drag to orbit · scroll to zoom</div>
<script src="../js/vendor/three.min.js"></script>
<script src="../js/vendor/STLLoader.js"></script>
<script src="js/promo-parts.js"></script>
<script src="js/components.js"></script>
<script src="js/flow-paths.js"></script>
<script src="js/promo.js"></script>
</body>
</html>
