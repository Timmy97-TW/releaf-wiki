<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 495" width="880" height="495" role="img" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>MOCK. E1: link loss and latency (DT-1)</title><desc>Template, no data. Left: a commanded pump step and the PT-01 response against time from command. Right: what must be reported.</desc><rect x="702" y="12" width="166" height="26" rx="3" fill="#fdf3dc" stroke="#92610c" stroke-dasharray="4 3"/><text x="785.0" y="30.0" font-size="11.5" fill="#92610c" text-anchor="middle" font-weight="700">MOCK · NO DATA YET</text><line x1="80" y1="416.0" x2="600" y2="416.0" stroke="#e5e5e5"/><text x="72.0" y="420.0" font-size="11" fill="#737373" text-anchor="end" font-weight="400">0</text><line x1="80" y1="326.0" x2="600" y2="326.0" stroke="#e5e5e5"/><text x="72.0" y="330.0" font-size="11" fill="#737373" text-anchor="end" font-weight="400">2</text><line x1="80" y1="236.0" x2="600" y2="236.0" stroke="#e5e5e5"/><text x="72.0" y="240.0" font-size="11" fill="#737373" text-anchor="end" font-weight="400">4</text><line x1="80" y1="146.0" x2="600" y2="146.0" stroke="#e5e5e5"/><text x="72.0" y="150.0" font-size="11" fill="#737373" text-anchor="end" font-weight="400">6</text><line x1="80" y1="56.0" x2="600" y2="56.0" stroke="#e5e5e5"/><text x="72.0" y="60.0" font-size="11" fill="#737373" text-anchor="end" font-weight="400">8</text><line x1="80" y1="416" x2="600" y2="416" stroke="#737373"/><line x1="80.0" y1="416" x2="80.0" y2="420" stroke="#737373"/><text x="80.0" y="434.0" font-size="11" fill="#737373" text-anchor="middle" font-weight="400">-2</text><line x1="166.7" y1="416" x2="166.7" y2="420" stroke="#737373"/><text x="166.7" y="434.0" font-size="11" fill="#737373" text-anchor="middle" font-weight="400">0</text><line x1="253.3" y1="416" x2="253.3" y2="420" stroke="#737373"/><text x="253.3" y="434.0" font-size="11" fill="#737373" text-anchor="middle" font-weight="400">2</text><line x1="340.0" y1="416" x2="340.0" y2="420" stroke="#737373"/><text x="340.0" y="434.0" font-size="11" fill="#737373" text-anchor="middle" font-weight="400">4</text><line x1="426.7" y1="416" x2="426.7" y2="420" stroke="#737373"/><text x="426.7" y="434.0" font-size="11" fill="#737373" text-anchor="middle" font-weight="400">6</text><line x1="513.3" y1="416" x2="513.3" y2="420" stroke="#737373"/><text x="513.3" y="434.0" font-size="11" fill="#737373" text-anchor="middle" font-weight="400">8</text><line x1="600.0" y1="416" x2="600.0" y2="420" stroke="#737373"/><text x="600.0" y="434.0" font-size="11" fill="#737373" text-anchor="middle" font-weight="400">10</text><text x="340.0" y="454.0" font-size="12" fill="#525252" text-anchor="middle" font-weight="400">Time from SET sent (s)</text><text x="30.0" y="236.0" font-size="12" fill="#525252" text-anchor="middle" font-weight="400" transform="rotate(-90 30.0 236.0)">PT-01 (psi)</text><line x1="166.7" y1="56" x2="166.7" y2="416" stroke="#171717" stroke-width="1.4" stroke-dasharray="4 3"/><text x="172.7" y="72.0" font-size="11" fill="#171717" text-anchor="start" font-weight="400">SET P01 sent</text><text x="340.0" y="236.0" font-size="12" fill="#737373" text-anchor="middle" font-weight="400" font-style="italic">20 steps per direction, overlaid</text><text x="630.0" y="90.0" font-size="12" fill="#171717" text-anchor="start" font-weight="650">Report</text><text x="630.0" y="114.0" font-size="11.5" fill="#525252" text-anchor="start" font-weight="400">PV lines expected vs received</text><text x="630.0" y="133.0" font-size="11.5" fill="#525252" text-anchor="start" font-weight="400">loss = missing counters N / expected</text><text x="630.0" y="152.0" font-size="11.5" fill="#525252" text-anchor="start" font-weight="400">longest gap between PV lines (s)</text><text x="630.0" y="171.0" font-size="11.5" fill="#525252" text-anchor="start" font-weight="400">SET → ACK: median, IQR (ms)</text><text x="630.0" y="190.0" font-size="11.5" fill="#525252" text-anchor="start" font-weight="400">SET → 63 % of ΔPT-01: median, IQR (s)</text><text x="630.0" y="227.0" font-size="11.5" fill="#14402b" text-anchor="start" font-weight="700">Acceptance (fixed in advance)</text><text x="630.0" y="246.0" font-size="11.5" fill="#14402b" text-anchor="start" font-weight="400">loss &lt; 1 %; no gap &gt; 5 s</text><text x="630.0" y="264.0" font-size="11.5" fill="#14402b" text-anchor="start" font-weight="400">fail-safe stop ≤ 6 s in 3 of 3</text><text x="630.0" y="282.0" font-size="11.5" fill="#14402b" text-anchor="start" font-weight="400">median SET → 63 % ≤ 10 s</text></svg>
