0" y="454.0" font-size="12" fill="#525252" text-anchor="middle" font-weight="400">Forecast horizon (h)</text><text x="30.0" y="236.0" font-size="12" fill="#525252" text-anchor="middle" font-weight="400" transform="rotate(-90 30.0 236.0)">RMSE of ΔP_net forecast (mbar)</text><rect x="80" y="296.0" width="520" height="120.0" fill="#fafafa"/><line x1="80" y1="296.0" x2="600" y2="296.0" stroke="#737373" stroke-width="1.2" stroke-dasharray="4 3"/><text x="592.0" y="290.0" font-size="10.5" fill="#737373" text-anchor="end" font-weight="400" font-style="italic">10 mbar: residual SD of R1 (module fitted)</text><text x="630.0" y="90.0" font-size="12" fill="#171717" text-anchor="start" font-weight="650">Report</text><text x="630.0" y="114.0" font-size="11.5" fill="#525252" text-anchor="start" font-weight="400">rolling origins every 1 h, 24–36 h</text><text x="630.0" y="133.0" font-size="11.5" fill="#525252" text-anchor="start" font-weight="400">fit on 0 to origin; no later data</text><text x="630.0" y="152.0" font-size="11.5" fill="#525252" text-anchor="start" font-weight="400">RMSE at 1, 3, 6 and 12 h ahead</text><text x="630.0" y="171.0" font-size="11.5" fill="#525252" text-anchor="start" font-weight="400">same for persistence forecast</text><text x="630.0" y="208.0" font-size="11.5" fill="#14402b" text-anchor="start" font-weight="700">Acceptance (fixed in advance)</text><text x="630.0" y="227.0" font-size="11.5" fill="#14402b" text-anchor="start" font-weight="400">12 h RMSE ≤ 10 mbar and below</text><text x="630.0" y="245.0" font-size="11.5" fill="#14402b" text-anchor="start" font-weight="400">persistence, on an informative run</text></svg>
