<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>What each bioreactor run returned, before and after the acceptance gate</title><desc>Two horizontal bars on a time axis from 0 to 44 hours. Run 5, on 8 to 10 October without the gate, is readable as a growth curve for its first 10.6 hours and hatched after that, with three restart marks. Run 6, on 14 to 16 October with the gate running, is readable for 37 hours and hatched for the last 4.8, where the sample beam was lost and the gate flagged the reading instead of publishing it.</desc><rect width="640" height="300" fill="#ffffff"/><defs><pattern id="hx" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#f4f4f6"/><line x1="0" y1="0" x2="0" y2="7" stroke="#c9c9d2" stroke-width="2"/></pattern></defs><line x1="150.0" y1="56" x2="150.0" y2="208" stroke="#e5e5e5"/><text x="150.0" y="226" font-size="11" fill="#6b6b6b" text-anchor="middle">0</text><line x1="232.5" y1="56" x2="232.5" y2="208" stroke="#e5e5e5"/><text x="232.5" y="226" font-size="11" fill="#6b6b6b" text-anchor="middle">8</text><line x1="315.1" y1="56" x2="315.1" y2="208" stroke="#e5e5e5"/><text x="315.1" y="226" font-size="11" fill="#6b6b6b" text-anchor="middle">16</text><line x1="397.6" y1="56" x2="397.6" y2="208" stroke="#e5e5e5"/><text x="397.6" y="226" font-size="11" fill="#6b6b6b" text-anchor="middle">24</text><line x1="480.2" y1="56" x2="480.2" y2="208" stroke="#e5e5e5"/><text x="480.2" y="226" font-size="11" fill="#6b6b6b" text-anchor="middle">32</text><line x1="562.7" y1="56" x2="562.7" y2="208" stroke="#e5e5e5"/><text x="562.7" y="226" font-size="11" fill="#6b6b6b" text-anchor="middle">40</text><text x="377" y="248" font-size="12" fill="#525252" text-anchor="middle">Hours into the run</text><text x="136" y="94" font-size="12.5" fill="#525252" text-anchor="end" font-weight="600">Run 5 &#183; 8 to 10 Oct</text><text x="136" y="110" font-size="11" fill="#6b6b6b" text-anchor="end">no gate</text><rect x="150.0" y="76" width="392.1" height="30" rx="7" fill="url(#hx)" stroke="#dcdce2"/><rect x="150.0" y="76" width="109.4" height="30" rx="7" fill="#92610c"/><text x="204.7" y="96" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="600">10.6&#8201;h readable</text><text x="550.1" y="96" font-size="11" fill="#6b6b6b"></text><line x1="251.1" y1="70" x2="251.1" y2="110" stroke="#8a5a0b" stroke-width="2" stroke-dasharray="3 3"/><line x1="350.2" y1="70" x2="350.2" y2="110" stroke="#8a5a0b" stroke-width="2" stroke-dasharray="3 3"/><line x1="448.2" y1="70" x2="448.2" y2="110" stroke="#8a5a0b" stroke-width="2" stroke-dasharray="3 3"/><text x="350.2" y="64" font-size="10.5" fill="#8a5a0b" text-anchor="middle">three restarts</text><text x="136" y="172" font-size="12.5" fill="#525252" text-anchor="end" font-weight="600">Run 6 &#183; 14 to 16 Oct</text><text x="136" y="188" font-size="11" fill="#6b6b6b" text-anchor="end">gate running</text><rect x="150.0" y="154" width="431.3" height="30" rx="7" fill="url(#hx)" stroke="#dcdce2"/><rect x="150.0" y="154" width="381.8" height="30" rx="7" fill="#23684a"/><text x="340.9" y="174" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="600">37&#8201;h readable</text><text x="589.3" y="174" font-size="11" fill="#6b6b6b"></text><text x="556.5" y="192" font-size="10.5" fill="#6b6b6b" text-anchor="middle">beam lost,</text><text x="556.5" y="204" font-size="10.5" fill="#6b6b6b" text-anchor="middle">flagged</text><text x="16" y="30" font-size="12.5" fill="#525252" font-weight="600">What the record supports</text><text x="176" y="30" font-size="11.5" fill="#6b6b6b">solid = usable as a growth curve &#183; hatched = logged but not used</text><text x="16" y="282" font-size="11" fill="#6b6b6b">Run 6 only</text><text x="86" y="282" font-size="11" fill="#525252">31 of 1,083 windows held back by the gate &#183; growth fitted at 0.286&#8201;h&#8315;&#185;, doubling 145&#8201;min</text></svg>