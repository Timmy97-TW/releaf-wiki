<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" width="640" height="430" role="img" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>The three instruments against the silica mass standard, inside the 0 to 1 OD window</title><desc>Optical density at 600 nm against milligrams of silica added, for the nine points of the 10 October 2026 run that fall inside the BioDrop’s own specified range. The BioDrop and the Pro climb on almost the same slope, 0.0489 and 0.0458 OD per milligram, with the Pro about 0.12 OD below the reference at every point. The Slim climbs at 0.0086, roughly a fifth as steep, and is as straight as either.</desc><rect width="640" height="430" fill="#ffffff"/><line x1="62.0" y1="348.0" x2="470.0" y2="348.0" stroke="#e5e5e5" stroke-width="1"/><text x="54.0" y="352.0" font-size="11" fill="#6b6b6b" text-anchor="end" font-weight="400">0</text><line x1="62.0" y1="272.0" x2="470.0" y2="272.0" stroke="#e5e5e5" stroke-width="1"/><text x="54.0" y="276.0" font-size="11" fill="#6b6b6b" text-anchor="end" font-weight="400">0.25</text><line x1="62.0" y1="196.0" x2="470.0" y2="196.0" stroke="#e5e5e5" stroke-width="1"/><text x="54.0" y="200.0" font-size="11" fill="#6b6b6b" text-anchor="end" font-weight="400">0.5</text><line x1="62.0" y1="120.0" x2="470.0" y2="120.0" stroke="#e5e5e5" stroke-width="1"/><text x="54.0" y="124.0" font-size="11" fill="#6b6b6b" text-anchor="end" font-weight="400">0.75</text><line x1="62.0" y1="44.0" x2="470.0" y2="44.0" stroke="#e5e5e5" stroke-width="1"/><text x="54.0" y="48.0" font-size="11" fill="#6b6b6b" text-anchor="end" font-weight="400">1</text><text x="62.0" y="365" font-size="11" fill="#6b6b6b" text-anchor="middle" font-weight="400">0</text><text x="164.0" y="365" font-size="11" fill="#6b6b6b" text-anchor="middle" font-weight="400">5</text><text x="266.0" y="365" font-size="11" fill="#6b6b6b" text-anchor="middle" font-weight="400">10</text><text x="368.0" y="365" font-size="11" fill="#6b6b6b" text-anchor="middle" font-weight="400">15</text><text x="470.0" y="365" font-size="11" fill="#6b6b6b" text-anchor="middle" font-weight="400">20</text><line x1="62.0" y1="348.0" x2="470.0" y2="348.0" stroke="#cfcfcf" stroke-width="1"/><line x1="62.0" y1="343.4" x2="470.0" y2="46.3" stroke="#92610c" stroke-width="1.5"/><circle cx="62.0" cy="348.0" r="2.8" fill="#92610c"/><circle cx="113.0" cy="303.9" r="2.8" fill="#92610c"/><circle cx="164.0" cy="267.7" r="2.8" fill="#92610c"/><circle cx="215.0" cy="233.4" r="2.8" fill="#92610c"/><circle cx="266.0" cy="196.3" r="2.8" fill="#92610c"/><circle cx="317.0" cy="159.2" r="2.8" fill="#92610c"/><circle cx="368.0" cy="104.5" r="2.8" fill="#92610c"/><circle cx="419.0" cy="86.3" r="2.8" fill="#92610c"/><circle cx="470.0" cy="54.3" r="2.8" fill="#92610c"/><line x1="90.3" y1="348.0" x2="470.0" y2="88.6" stroke="#3f5468" stroke-width="1.5"/><circle cx="62.0" cy="348.0" r="2.8" fill="#3f5468"/><circle cx="113.0" cy="332.6" r="2.8" fill="#3f5468"/><circle cx="164.0" cy="303.6" r="2.8" fill="#3f5468"/><circle cx="215.0" cy="271.3" r="2.8" fill="#3f5468"/><circle cx="266.0" cy="242.8" r="2.8" fill="#3f5468"/><circle cx="317.0" cy="201.1" r="2.8" fill="#3f5468"/><circle cx="368.0" cy="157.9" r="2.8" fill="#3f5468"/><circle cx="419.0" cy="116.5" r="2.8" fill="#3f5468"/><circle cx="470.0" cy="77.9" r="2.8" fill="#3f5468"/><line x1="62.0" y1="345.5" x2="470.0" y2="293.2" stroke="#23684a" stroke-width="1.5"/><circle cx="62.0" cy="348.0" r="2.8" fill="#23684a"/><circle cx="113.0" cy="338.7" r="2.8" fill="#23684a"/><circle cx="164.0" cy="331.5" r="2.8" fill="#23684a"/><circle cx="215.0" cy="325.0" r="2.8" fill="#23684a"/><circle cx="266.0" cy="318.1" r="2.8" fill="#23684a"/><circle cx="317.0" cy="311.4" r="2.8" fill="#23684a"/><circle cx="368.0" cy="306.9" r="2.8" fill="#23684a"/><circle cx="419.0" cy="300.8" r="2.8" fill="#23684a"/><circle cx="470.0" cy="294.1" r="2.8" fill="#23684a"/><line x1="388.4" y1="105.7" x2="388.4" y2="144.3" stroke="#8a8a8a" stroke-width="1"/><line x1="384.9" y1="105.7" x2="391.9" y2="105.7" stroke="#8a8a8a" stroke-width="1"/><line x1="384.9" y1="144.3" x2="391.9" y2="144.3" stroke="#8a8a8a" stroke-width="1"/><text x="396.4" y="129.0" font-size="11" fill="#525252" text-anchor="start" font-weight="400">0.12 OD</text><text x="266.0" y="386" font-size="12" fill="#525252" text-anchor="middle" font-weight="400">Silica added (mg into 500 mL)</text><text x="16" y="196" font-size="12" fill="#525252" text-anchor="middle" transform="rotate(-90 16 196)">Optical density at 600 nm</text><rect x="492" y="65" width="11" height="3" rx="1.5" fill="#92610c"/><text x="509" y="71" font-size="11" fill="#525252" text-anchor="start" font-weight="400">BioDrop, direct</text><rect x="492" y="82" width="11" height="3" rx="1.5" fill="#3f5468"/><text x="509" y="88" font-size="11" fill="#525252" text-anchor="start" font-weight="400">Pro, beam splitter</text><rect x="492" y="99" width="11" height="3" rx="1.5" fill="#23684a"/><text x="509" y="105" font-size="11" fill="#525252" text-anchor="start" font-weight="400">Slim, fibre</text><text x="492" y="156" font-size="12" fill="#3f5468" text-anchor="start" font-weight="600">1.001×</text><text x="492" y="172" font-size="10.5" fill="#6b6b6b" text-anchor="start" font-weight="400">the Pro read against</text><text x="492" y="185" font-size="10.5" fill="#6b6b6b" text-anchor="start" font-weight="400">the BioDrop here, low</text><text x="492" y="198" font-size="10.5" fill="#6b6b6b" text-anchor="start" font-weight="400">by a constant 0.12 OD</text><text x="492" y="237" font-size="12" fill="#23684a" text-anchor="start" font-weight="600">5.3×</text><text x="492" y="253" font-size="10.5" fill="#6b6b6b" text-anchor="start" font-weight="400">the Pro’s slope against</text><text x="492" y="266" font-size="10.5" fill="#6b6b6b" text-anchor="start" font-weight="400">the Slim’s, which buys</text><text x="492" y="279" font-size="10.5" fill="#6b6b6b" text-anchor="start" font-weight="400">the Slim its range</text></svg>
