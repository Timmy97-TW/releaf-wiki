t x="509.0" y="122.0" font-size="11" fill="#525252" text-anchor="start" font-weight="400">V1 low-range line</text><text x="492.0" y="156.0" font-size="12" fill="#3f5468" text-anchor="start" font-weight="600">−11.5%</text><text x="492.0" y="172.0" font-size="10.5" fill="#6b6b6b" text-anchor="start" font-weight="400">V1 at the top of the</text><text x="492.0" y="185.0" font-size="10.5" fill="#6b6b6b" text-anchor="start" font-weight="400">ladder, against its</text><text x="492.0" y="198.0" font-size="10.5" fill="#6b6b6b" text-anchor="start" font-weight="400">own low-range line</text><text x="492.0" y="224.0" font-size="12" fill="#23684a" text-anchor="start" font-weight="600">−2.9%</text><text x="492.0" y="240.0" font-size="10.5" fill="#6b6b6b" text-anchor="start" font-weight="400">V2 at the same point</text></svg>