<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" width="640" height="430" role="img" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>The 1 micrometre silica ladder read by both photometers and the benchtop reference</title><desc>Optical density against silica concentration for 41 cumulative additions on 10 October 2026. Photometer V1, the beam-splitter build, rises steeply and bends away from its own low-range line by 11.5 per cent at the top. Photometer V2, the fibre build, has a sixth of the slope but stays within 2.9 per cent of its line to the top of the ladder. The BioDrop benchtop reference scatters about 5 per cent per point and flattens near 2.48, which is why the series beyond that point was read by dilution instead.</desc><rect width="640" height="430" fill="#ffffff"/><line x1="62.0" y1="348.0" x2="470.0" y2="348.0" stroke="#e5e5e5" stroke-width="1"/><text x="54.0" y="352.0" font-size="11" fill="#6b6b6b" text-anchor="end" font-weight="400">0</text><line x1="62.0" y1="272.0" x2="470.0" y2="272.0" stroke="#e5e5e5" stroke-width="1"/><text x="54.0" y="276.0" font-size="11" fill="#6b6b6b" text-anchor="end" font-weight="400">0.9</text><line x1="62.0" y1="196.0" x2="470.0" y2="196.0" stroke="#e5e5e5" stroke-width="1"/><text x="54.0" y="200.0" font-size="11" fill="#6b6b6b" text-anchor="end" font-weight="400">1.8</text><line x1="62.0" y1="120.0" x2="470.0" y2="120.0" stroke="#e5e5e5" stroke-width="1"/><text x="54.0" y="124.0" font-size="11" fill="#6b6b6b" text-anchor="end" font-weight="400">2.7</text><line x1="62.0" y1="44.0" x2="470.0" y2="44.0" stroke="#e5e5e5" stroke-width="1"/><text x="54.0" y="48.0" font-size="11" fill="#6b6b6b" text-anchor="end" font-weight="400">3.6</text><text x="62.0" y="365.0" font-size="11" fill="#6b6b6b" text-anchor="middle" font-weight="400">0</text><text x="202.7" y="365.0" font-size="11" fill="#6b6b6b" text-anchor="middle" font-weight="400">0.5</text><text x="343.4" y="365.0" font-size="11" fill="#6b6b6b" text-anchor="middle" font-weight="400">1</text><line x1="62.0" y1="348.0" x2="470.0" y2="348.0" stroke="#cfcfcf" stroke-width="1"/><line x1="62.0" y1="359.0" x2="470.0" y2="31.2" stroke="#b9c4cd" stroke-width="1.2" stroke-dasharray="4 4"/><polyline points="76.1,335.8 89.9,325.7 103.4,316.2 116.6,305.9 129.6,295.6 142.3,280.4 154.8,275.3 167.0,266.4 178.9,256.1 190.7,247.6 202.2,239.9 213.4,231.0 224.5,224.3 235.3,218.3 245.9,212.5 256.3,206.2 266.5,200.6 276.5,194.5 286.2,186.7 295.8,174.9 305.2,170.3 314.4,165.9 323.4,159.9 332.3,152.6 340.9,149.8 349.4,138.2 357.8,138.3" fill="none" stroke="#92610c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="62.0,348.0 76.1,343.9 89.9,336.7 103.4,327.3 116.6,318.7 129.6,306.2 142.3,294.7 154.8,283.1 167.0,272.6 178.9,261.7 190.7,251.5 202.2,244.6 213.4,236.8 224.5,228.4 235.3,219.1 245.9,211.0 256.3,204.8 266.5,199.8 276.5,193.0 286.2,184.3 295.8,177.9 305.2,172.0 314.4,165.0 323.4,157.6 332.3,150.5 340.9,145.5 349.4,139.4 357.8,134.0 365.9,129.5 373.9,126.2 381.7,121.5 389.4,116.0 396.9,111.2 404.3,108.2 411.5,103.3 418.6,98.4 425.5,95.1 432.3,90.5 439.0,85.8 445.5,82.3 451.9,80.5" fill="none" stroke="#3f5468" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><polyline points="62.0,348.0 76.1,345.4 89.9,343.5 103.4,341.6 116.6,339.7 129.6,338.0 142.3,336.6 154.8,334.9 167.0,333.3 178.9,331.6 190.7,330.1 202.2,328.5 213.4,327.0 224.5,326.0 235.3,324.8 245.9,323.7 256.3,322.5 266.5,321.5 276.5,320.5 286.2,319.1 295.8,317.7 305.2,316.4 314.4,315.4 323.4,314.2 332.3,313.0 340.9,311.8 349.4,310.7 357.8,309.5 365.9,308.4 373.9,307.3 381.7,306.2 389.4,305.2 396.9,304.2 404.3,303.1 411.5,302.2 418.6,301.3 425.5,300.4 432.3,299.5 439.0,298.7 445.5,297.8 451.9,297.0" fill="none" stroke="#23684a" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="62.0" cy="348.0" r="2.4" fill="#3f5468"/><circle cx="116.6" cy="318.7" r="2.4" fill="#3f5