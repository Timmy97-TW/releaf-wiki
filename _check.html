<!doctype html><meta charset=utf-8><title>check</title>
<style>html,body{margin:0}iframe{border:0}</style>
<div id="out">pending</div>
<script>
var slug = new URLSearchParams(location.search).get('p') || 'results';
var w = +(new URLSearchParams(location.search).get('w') || 390);
var f = document.createElement('iframe');
f.width = w; f.height = 900; f.src = '/' + slug + '/';
document.body.appendChild(f);
f.onload = function(){
  setTimeout(function(){
    var d = f.contentDocument, W = d.documentElement.clientWidth, lines = [];
    lines.push('viewport=' + W + ' scrollWidth=' + d.documentElement.scrollWidth);
    d.querySelectorAll('*').forEach(function(el){
      var r = el.getBoundingClientRect();
      if (r.width > 0 && (r.right > W + 1 || r.left < -1)) {
        var p = el.parentElement;
        var pr = p ? p.getBoundingClientRect() : null;
        if (pr && pr.right > W + 1) return; // only report topmost offender
        lines.push('OVERFLOW ' + el.tagName + '.' + el.className + ' left=' + Math.round(r.left) + ' right=' + Math.round(r.right) + ' w=' + Math.round(r.width) + ' :: ' + (el.textContent||'').slice(0,60).replace(/\s+/g,' '));
      }
    });
    d.querySelectorAll('img').forEach(function(im){
      if(!im.getAttribute('width')||!im.getAttribute('height')) lines.push('NOWH ' + im.getAttribute('src'));
      if(!im.getAttribute('loading')) lines.push('NOLAZY ' + im.getAttribute('src'));
    });
    d.querySelectorAll('table').forEach(function(t){
      var wrap = t.closest('.tablewrap');
      if(!wrap) lines.push('NOWRAP table :: ' + (t.querySelector('th')||{}).textContent);
      if(t.scrollWidth > (wrap||t).clientWidth + 2) lines.push('TABLEOVER ' + ((t.querySelector('th')||{}).textContent||'') + ' sw=' + t.scrollWidth + ' cw=' + (wrap||t).clientWidth + ' top=' + Math.round((wrap||t).getBoundingClientRect().top + f.contentWindow.scrollY));
    });
    document.getElementById('out').textContent = lines.join('\n');
  }, 1500);
};
</script>
