/* apo minus holo, one bar per receptor residue, interface residues marked */
function drawDelta(against){
 const d=D.cmp[against].delta, rf=D.receptor_first;
 const iface=new Set(D.interface);
 const W=Math.max(880,d.length*1.25), H=250, p={l:52,r:14,t:16,b:34};
 const bw=(W-p.l-p.r)/d.length;
 const m=Math.max(0.4,...d.map(Math.abs));
 const y0=p.t+(H-p.t-p.b)/2;
 const y=v=>y0-(v/m)*((H-p.t-p.b)/2);
 let o=`<line x1="${p.l}" y1="${y0}" x2="${W-p.r}" y2="${y0}" stroke="${cs('--line')}"
   stroke-width="1.3"/>`;
 for(const s of[-1,-.5,.5,1]){const yy=y0-s*((H-p.t-p.b)/2);
  o+=`<line class="gl" x1="${p.l}" y1="${yy}" x2="${W-p.r}" y2="${yy}" stroke-dasharray="2 4"/>
      <text class="axis" x="${p.l-7}" y="${yy+3.5}" text-anchor="end">${sgn(s*m,1)}</text>`}
 d.forEach((v,i)=>{const on=iface.has(i+rf), yy=y(v);
  o+=`<rect x="${f(p.l+i*bw,2)}" y="${f(Math.min(y0,yy),2)}" width="${f(Math.max(bw*.9,.7),2)}"
    height="${f(Math.abs(yy-y0),2)}" fill="${on?cs('--pep'):cs('--rec')}"
    opacity="${on?.95:.42}"/>`});
 for(let n=50;n<=750;n+=50){const i=n-rf; if(i<0||i>=d.length)continue;
  o+=`<text class="axis" x="${f(p.l+i*bw,1)}" y="${H-10}" text-anchor="middle">${n}</text>`}
 o+=`<text class="axis" x="11" y="${H/2}" text-anchor="middle"
   transform="rotate(-90 11 ${H/2})">${L('Δ Cα RMSF (Å)','Δ Cα RMSF (Å)')}</text>
  <text class="axis" x="${p.l}" y="${p.t-2}" fill="${cs('--pep')}" style="font-weight:700">${
   L('往上 = 沒有胜肽時比較鬆','up = looser without the peptide')}</text>`;
 return `<svg viewBox="0 0 ${W} ${H}" width="${W}" style="max-width:none">${o}</svg>`}
